<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="interclub.detail_page_title">Межклубный турнир — Chess Home</title>
<meta name="description" content="Межклубный турнир Chess Home">
<link rel="stylesheet" href="/css/main.css">
<link rel="icon" type="image/png" href="/img/logo/favicon.png">
<style>
  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); }

  .ictd-page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  .ictd-back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text-secondary); text-decoration: none;
    font-size: 13px; font-weight: 600; margin-bottom: 20px;
    padding: 6px 12px; border-radius: 8px;
    transition: color 0.15s, background 0.15s;
  }
  .ictd-back-link:hover { color: var(--accent); background: rgba(201,168,76,0.08); }

  /* ── HERO ── */
  .ictd-hero {
    position: relative; border-radius: 20px;
    background: linear-gradient(135deg, #1a1c26 0%, #1e2030 40%, #1a1e2c 100%);
    border: 1px solid var(--border-light);
    overflow: hidden; padding: 32px 36px; margin-bottom: 20px;
  }
  .ictd-hero::before {
    content: ''; position: absolute; top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .ictd-hero-bg-text { position: absolute; right: 24px; bottom: -26px; font-size: 140px; opacity: 0.04; pointer-events: none; user-select: none; }
  .ictd-hero-top { display: flex; align-items: flex-start; gap: 20px; position: relative; z-index: 1; flex-wrap: wrap; }
  .ictd-hero-icon { width: 64px; height: 64px; border-radius: 16px; background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.25); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
  .ictd-hero-info { flex: 1; min-width: 0; } /* issue #22: 240px не влезает в 320px экран */
  .ictd-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 11px; border-radius: 20px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    white-space: nowrap; margin-bottom: 10px;
  }
  .ictd-badge.active   { background: rgba(76,175,114,0.15); color: var(--green); border: 1px solid rgba(76,175,114,0.3); }
  .ictd-badge.upcoming { background: rgba(201,168,76,0.12); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
  .ictd-badge.finished { background: rgba(90,94,120,0.15); color: var(--text-muted); border: 1px solid var(--border); }
  .ictd-status-dot { width: 5px; height: 5px; border-radius: 50%; }
  .ictd-badge.active .ictd-status-dot { background: var(--green); box-shadow: 0 0 6px var(--green); animation: ictdPulse 1.5s infinite; }
  .ictd-badge.upcoming .ictd-status-dot { background: var(--accent); }
  .ictd-badge.finished .ictd-status-dot { background: var(--text-muted); }
  @keyframes ictdPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }
  @keyframes tSpin { to { transform: rotate(360deg); } }

  .ictd-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; line-height: 1.25; }
  .ictd-organizer { color: var(--text-secondary); font-size: 13px; margin-bottom: 4px; }
  .ictd-organizer b { color: var(--text-primary); }
  .ictd-desc { color: var(--text-secondary); font-size: 14px; line-height: 1.6; max-width: 680px; margin-top: 10px; white-space: pre-wrap; }

  .ictd-hero-admin { display: flex; gap: 8px; flex-shrink: 0; }

  /* ── STATS ROW ── */
  .ictd-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .ictd-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .ictd-stat-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
  .ictd-stat-value { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--text-primary); }

  /* ── COUNTDOWN ── */
  .ictd-countdown { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .ictd-countdown-label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
  .ictd-countdown-value { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--accent); }

  /* ── ACTIONS ── */
  .ictd-actions-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .ictd-my-team-banner {
    display: flex; align-items: center; gap: 7px;
    background: rgba(201,168,76,0.08); border: 1px solid rgba(201,168,76,0.25);
    border-radius: 9px; padding: 9px 14px; font-size: 13px; color: var(--accent);
  }

  .btn {
    padding: 10px 20px; border-radius: 10px; border: none; font-size: 13.5px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #000; box-shadow: 0 4px 16px rgba(201,168,76,0.3); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(201,168,76,0.45); }
  .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--border-light); color: var(--text-primary); }
  .btn-danger { background: rgba(224,85,85,0.12); color: var(--red); border: 1px solid rgba(224,85,85,0.3); }
  .btn-danger:hover { background: rgba(224,85,85,0.2); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

  /* ── TEAMS ROW ── */
  .ictd-section-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .ictd-teams-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .ictd-team-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px; font-size: 12.5px; color: var(--text-secondary); text-decoration: none;
  }
  .ictd-team-chip:hover { border-color: var(--accent); color: var(--accent); }
  .ictd-team-chip.mine { border-color: var(--accent); color: var(--accent); background: rgba(201,168,76,0.08); }

  /* ── TABS ── */
  .ictd-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
  .ictd-tab { padding: 10px 18px; border: none; background: transparent; color: var(--text-secondary); font-size: 13.5px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; margin-bottom: -1px; }
  .ictd-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .ictd-tab:hover:not(.active) { color: var(--text-primary); }
  .ictd-tabpanel { display: none; }
  .ictd-tabpanel.active { display: block; }

  /* ── TEAM STANDINGS TABLE ── */
  .ictd-standings { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .ictd-standings-head {
    display: grid; grid-template-columns: 40px 1fr 70px 70px 70px 70px 74px;
    padding: 10px 16px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-muted); border-bottom: 1px solid var(--border); background: var(--bg-secondary);
  }
  .ictd-standings-head span:not(:first-child) { text-align: center; }
  .ictd-team-row { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .ictd-team-row:last-child { border-bottom: none; }
  .ictd-team-row-main {
    display: grid; grid-template-columns: 40px 1fr 70px 70px 70px 70px 74px;
    align-items: center; padding: 12px 16px; cursor: pointer; gap: 4px;
  }
  .ictd-team-row-main:hover { background: var(--bg-hover); }
  .ictd-team-row.mine .ictd-team-row-main { background: rgba(201,168,76,0.06); }
  .ictd-team-row-main span { text-align: center; font-size: 13px; color: var(--text-secondary); }
  .ictd-tr-rank { font-weight: 800; color: var(--text-muted); font-size: 14px !important; }
  .ictd-team-row:nth-child(1) .ictd-tr-rank { color: #d9b64c; }
  .ictd-team-row:nth-child(2) .ictd-tr-rank { color: #b9bfce; }
  .ictd-team-row:nth-child(3) .ictd-tr-rank { color: #c98a52; }
  .ictd-tr-name { display: flex; align-items: center; gap: 8px; text-align: left !important; font-weight: 700; color: var(--text-primary); overflow: hidden; }
  .ictd-tr-name span.tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ictd-tr-caret { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
  .ictd-team-row.open .ictd-tr-caret { transform: rotate(90deg); }
  .ictd-tr-score { font-family: var(--font-mono); font-weight: 800; color: var(--accent) !important; font-size: 15px !important; }
  .ictd-tr-w { color: var(--green) !important; font-weight: 700; }
  .ictd-tr-l { color: var(--red) !important; font-weight: 700; }

  .ictd-team-players { display: none; padding: 4px 16px 14px 66px; }
  .ictd-team-row.open .ictd-team-players { display: block; }
  .ictd-player-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12.5px; color: var(--text-secondary); border-top: 1px dashed var(--border); }
  .ictd-player-row:first-child { border-top: none; }
  .ictd-player-rank { width: 18px; color: var(--text-muted); flex-shrink: 0; }
  .ictd-player-name { flex: 1; color: var(--text-primary); font-weight: 600; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ictd-player-name:hover { color: var(--accent); }
  .ictd-player-score { font-family: var(--font-mono); font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .ictd-team-players-empty { padding: 8px 0; color: var(--text-muted); font-size: 12px; }
  .ictd-player-status { font-size: 11px; flex-shrink: 0; }
  .ictd-player-status.playing { color: var(--green); }
  .ictd-player-status.waiting { color: var(--accent); }
  .ictd-player-status.idle    { color: var(--text-muted); }

  /* ── MY STATUS BANNER (жеребьёвка / пауза / игра идёт) ── */
  #my-status-banner { border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px; font-size: 14px; font-weight: 600; border-width: 1px; border-style: solid; }

  @media (max-width: 640px) {
    .ictd-standings-head, .ictd-team-row-main { grid-template-columns: 30px minmax(0,1fr) 60px; } /* issue #22: minmax(0,1fr), чтобы длинные имена команд не ломали строку */
    .ictd-standings-head span.hide-mobile, .ictd-team-row-main span.hide-mobile { display: none; }
  }

  /* ── GAMES LIST ── */
  .ictd-games-list { display: flex; flex-direction: column; gap: 8px; }
  .ictd-game-row { display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 13px; flex-wrap: wrap; }
  .ictd-game-players { flex: 1; min-width: 180px; color: var(--text-primary); font-weight: 600; overflow-wrap: anywhere; word-break: break-word; } /* issue #22 */
  .ictd-game-result { font-family: var(--font-mono); font-weight: 800; color: var(--accent); }
  .ictd-game-meta { color: var(--text-muted); font-size: 11.5px; }

  /* ── CHAT ── */
  .ictd-chat-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; height: 440px; }
  .ictd-chat-msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .ictd-chat-msg { font-size: 13px; line-height: 1.5; }
  .ictd-chat-msg .u { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .ictd-chat-msg.system { color: var(--text-muted); font-style: italic; font-size: 12px; }
  .ictd-chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .ictd-chat-input-row input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 9px; color: var(--text-primary); font-size: 13.5px; padding: 9px 14px; }
  .ictd-chat-input-row input:focus { outline: none; border-color: var(--accent); }

  .ictd-empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .ictd-loading { text-align: center; padding: 80px 0; color: var(--text-muted); }
  .ictd-loading .ic { font-size: 48px; margin-bottom: 16px; }

  /* ── MODAL (team select) ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-box { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 20px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 32px; box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.08); transform: scale(0.95) translateY(10px); transition: transform 0.25s; }
  .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .modal-title { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
  .modal-close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .btn-cancel { padding: 10px 20px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 9px; color: var(--text-secondary); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-cancel:hover { border-color: var(--border-light); color: var(--text-primary); }
  .btn-submit { padding: 10px 24px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border: none; border-radius: 9px; color: #000; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 16px rgba(201,168,76,0.3); }
  .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(201,168,76,0.45); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .team-select-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
  .team-select-option { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: all 0.15s; }
  .team-select-option:hover { border-color: var(--border-light); background: var(--bg-hover); }
  .team-select-option.selected { border-color: var(--accent); background: rgba(201,168,76,0.08); }
  .team-select-option input { accent-color: var(--accent); width: 17px; height: 17px; flex-shrink: 0; }
  .team-select-option-name { font-weight: 700; color: var(--text-primary); font-size: 14px; }

  #toast-container { position: fixed; bottom: 28px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow); animation: slideRight 0.3s ease; pointer-events: all; }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }
  @keyframes slideRight { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }

  @media (max-width: 600px) {
    .ictd-hero { padding: 22px 18px; }
    .ictd-title { font-size: 22px; }
  }
</style>
</head>
<body>

<script src="/js/header.js"></script>

<div class="ictd-page" id="ictd-page">
  <a href="/interclub-tournaments" class="ictd-back-link" data-i18n="interclub.back_detail">← Все межклубные турниры</a>
  <div class="ictd-loading" id="ictd-loading"><div class="ic">⏳</div><div data-i18n="interclub.loading_one">Загружаем турнир...</div></div>
  <div id="ictd-content" style="display:none"></div>
</div>

<!-- MODAL: TEAM SELECTION (join) -->
<div class="modal-overlay" id="team-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" data-i18n="interclub.select_team">🎽 Выберите команду</div>
      <button class="modal-close" onclick="closeTeamModal()">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:16px;" data-i18n="interclub.select_team_desc">
      Играть можно только за клуб, участником которого вы состоите. Выбор команды после первой сыгранной партии изменить нельзя.
    </p>
    <div class="team-select-list" id="team-select-list"></div>
    <div class="modal-footer">
      <button class="btn-cancel" data-i18n="interclub.cancel" onclick="closeTeamModal()">Отмена</button>
      <button class="btn-submit" id="btn-team-confirm" data-i18n="interclub.confirm_join" onclick="confirmTeamSelection()">✅ Участвовать</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = '/api';
const TOURNAMENT_ID = location.pathname.split('/').filter(Boolean).pop();

let currentUser = null;
let socket = null;
let tournament = null;
let currentTab = 'standings';
let openTeamIds = new Set();
let countdownTimer = null;

let joinTournamentId = null;
let joinSelectedTeamId = null;

// ── i18n helpers (словарь подгружается header.js через /js/i18n.js) ──
function T(key, vars) { return (window.CH_I18N && window.CH_I18N.t) ? CH_I18N.t(key, vars) : key; }
async function waitI18nReady() {
  let tries = 0;
  while (!(window.CH_I18N && window.CH_I18N.onReady) && tries < 100) { await new Promise(r => setTimeout(r, 50)); tries++; }
  if (window.CH_I18N && window.CH_I18N.onReady) await new Promise(r => CH_I18N.onReady(r));
}

// pendingResume: если игрок нажал "Играть" до auth_ok — запомним и выполним после
let _pendingResume = false;
let _graceBannerTimer = null; // тикает раз в секунду, пока идёт отсчёт грейс-периода после партии

async function safeJson(res) {
  try { return await res.json(); }
  catch (e) { throw new Error('Сервер вернул некорректный ответ' + (res.status ? ` (${res.status})` : '') + '. Попробуйте ещё раз.'); }
}
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── MSK TIME HELPERS ── (турнир всегда показывается в московском времени, UTC+3)
function formatMskDateTime(ts) {
  return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' }) + ' МСК';
}
function formatMskShort(ts) {
  return new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' });
}

// ── INIT ──
async function init() {
  await waitI18nReady();
  try {
    const r = await fetch(API + '/me', { credentials: 'same-origin' });
    if (r.ok) currentUser = await safeJson(r);
  } catch {}

  if (window.CH) {
    if (currentUser) CH.setCurrentUser(currentUser);
    CH.setActivePage('tournaments');
  }

  await loadTournament();
  connectSocket();
  countdownTimer = setInterval(updateCountdown, 1000);
}

// ── Запуск турнирной партии — сразу на доску (как в обычных турнирах) ──
function launchTournamentGame(data) {
  try { sessionStorage.setItem('ch_launch_game', JSON.stringify(data)); } catch (e) {}
  window.location.href = '/';
}

function pauseTournament() {
  if (socket && socket.connected) socket.emit('tournament_unseek', TOURNAMENT_ID);
}
function resumeTournament() {
  if (socket && socket.username) {
    socket.emit('tournament_waiting', { tournamentId: TOURNAMENT_ID });
  } else if (socket && socket.connected) {
    _pendingResume = true;
  }
}

function connectSocket() {
  try {
    socket = io();

    socket.on('disconnect', () => { socket.username = null; });

    socket.on('connect', () => {
      socket.emit('join_tournament_room', TOURNAMENT_ID);
      socket.emit('auth', null);
    });

    socket.on('auth_ok', (data) => {
      socket.username = (data && data.username) || (currentUser && currentUser.username) || socket.username;
      if (tournament && tournament.status === 'active') {
        const me = currentUser && currentUser.username;
        const myPart = me && tournament.participants && tournament.participants.find(p => p.username === me);
        if (myPart && !myPart.left && !myPart.anticheatBanned) {
          if (myPart.currentGameId) {
            // Пара уже создана на сервере, но клиент мог не успеть получить game_start — запросим явно
            socket.emit('tournament_rejoin', { tournamentId: TOURNAMENT_ID, gameId: myPart.currentGameId });
          } else if (_pendingResume) {
            _pendingResume = false;
            socket.emit('tournament_waiting', { tournamentId: TOURNAMENT_ID });
          } else if (myPart.waiting && !myPart.paused) {
            // Восстанавливаем поиск соперника после реконнекта
            socket.emit('tournament_waiting', { tournamentId: TOURNAMENT_ID });
          }
          // Если paused=true — игрок сам нажмёт "Играть" (не форсируем)
        }
      }
    });

    // game_start — сразу на доску, как в обычных турнирах
    socket.on('game_start', (data) => {
      if (!data.tournamentId || data.tournamentId !== TOURNAMENT_ID) return;
      if (data.moves && data.moves.length > 0) {
        try { sessionStorage.setItem('ch_launch_game', JSON.stringify(data)); } catch (e) {}
        window.location.href = '/';
        return;
      }
      launchTournamentGame(data);
    });

    socket.on('tournament_update', (t) => {
      if (!t || t.id !== TOURNAMENT_ID) return;
      const me = currentUser && currentUser.username;
      const prevPart = tournament && tournament.participants && tournament.participants.find(p => p.username === me);
      const prevGameId = prevPart ? prevPart.currentGameId : null;
      tournament = t;
      render();
      // Если у нас появилась новая партия (currentGameId), но клиент не получил game_start
      // (например, socket не успел авторизоваться к моменту спаринга на сервере) — запрашиваем старт вручную
      const myPart = me && t.participants && t.participants.find(p => p.username === me);
      if (myPart && myPart.currentGameId && myPart.currentGameId !== prevGameId && socket && socket.username) {
        socket.emit('tournament_rejoin', { tournamentId: TOURNAMENT_ID, gameId: myPart.currentGameId });
      }
    });

    socket.on('tournament_deleted', (id) => { if (id === TOURNAMENT_ID) { toast('Турнир был удалён', 'error'); setTimeout(() => location.href = "/interclub-tournaments", 1500); } });
    socket.on('anticheat_ban', (data) => { toast('⚠️ ' + data.username + ' — заблокирован за читерство', 'error'); loadTournament(); });
    socket.on('tournament_chat_msg', (data) => { if (data.tournamentId === TOURNAMENT_ID && currentTab === 'chat') appendChatMsg(data.msg); });
  } catch (e) { console.error(e); }
}

// ── Баннер моего статуса (жеребьёвка / игра / пауза) ──
function updateMyStatusBanner() {
  const banner = document.getElementById('my-status-banner');
  if (!banner) return;
  const me = currentUser && currentUser.username;
  if (!me || !tournament || tournament.status !== 'active') { banner.style.display = 'none'; return; }
  const myPart = tournament.participants && tournament.participants.find(p => p.username === me);
  if (!myPart || myPart.left || myPart.anticheatBanned) { banner.style.display = 'none'; return; }

  const BASE = 'border-color:';

  const isReallyPlaying = myPart.currentGameId &&
    tournament.participants.some(o => o.username !== me && o.currentGameId === myPart.currentGameId);

  // Грейс-период после партии: сервер не даст новую пару раньше myPart.nextEligibleAt —
  // показываем отсчёт и напоминаем про паузу, чтобы человек успел встать на паузу.
  const graceLeft = myPart.nextEligibleAt ? myPart.nextEligibleAt - Date.now() : 0;
  clearTimeout(_graceBannerTimer);

  if (isReallyPlaying) {
    banner.style.cssText = BASE + 'rgba(76,175,114,0.35);background:rgba(76,175,114,0.08)';
    banner.innerHTML = '<span style="font-size:22px">⚡</span><div style="flex:1"><div style="color:var(--green)">' + T('interclub.playing_now') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + T('interclub.game_in_progress') + '</div></div><a href="/game/' + myPart.currentGameId + '" class="btn btn-primary" style="font-size:12px;padding:7px 14px">' + T('interclub.go_to_game') + '</a>';
  } else if (myPart.waiting && graceLeft > 0) {
    banner.style.cssText = BASE + 'rgba(201,168,76,0.3);background:rgba(201,168,76,0.07)';
    const secs = Math.ceil(graceLeft / 1000);
    banner.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(201,168,76,0.3);border-top-color:var(--accent);border-radius:50%;animation:tSpin 0.8s linear infinite;flex-shrink:0"></div><div style="flex:1"><div style="color:var(--accent)">' + T('interclub.next_game_in', { n: secs }) + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + T('interclub.pause_hint') + '</div></div><button onclick="pauseTournament()" class="btn btn-secondary" style="font-size:12px;padding:7px 14px">' + T('interclub.pause_btn') + '</button>';
    // Перерисовываем раз в секунду, пока идёт отсчёт — свежего tournament_update от сервера в это время не будет
    _graceBannerTimer = setTimeout(updateMyStatusBanner, 1000);
  } else if (myPart.waiting) {
    banner.style.cssText = BASE + 'rgba(201,168,76,0.3);background:rgba(201,168,76,0.07)';
    banner.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(201,168,76,0.3);border-top-color:var(--accent);border-radius:50%;animation:tSpin 0.8s linear infinite;flex-shrink:0"></div><div style="flex:1"><div style="color:var(--accent)">' + T('interclub.searching') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + T('interclub.no_same_club') + '</div></div><button onclick="pauseTournament()" class="btn btn-secondary" style="font-size:12px;padding:7px 14px">' + T('interclub.pause_btn') + '</button>';
  } else {
    banner.style.cssText = BASE + 'var(--border);background:var(--bg-secondary)';
    const pauseLabel = myPart.paused
      ? '<div style="color:var(--text-secondary)">' + T('interclub.on_pause') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + T('interclub.resume_hint') + '</div>'
      : '<div style="color:var(--text-secondary)">' + T('interclub.game_finished') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + T('interclub.ready_hint') + '</div>';
    banner.innerHTML = '<span style="font-size:22px">⏸</span><div style="flex:1">' + pauseLabel + '</div><button onclick="resumeTournament()" class="btn btn-primary" style="font-size:12px;padding:7px 14px">' + T('interclub.play_btn') + '</button>';
  }
  banner.style.display = 'flex';
}

async function loadTournament() {
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID);
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || 'Турнир не найден');
    if (!data.isInterclub) {
      // Обычный турнир по ошибке открыт со страницы межклубных — уводим на общую страницу турнира.
      location.replace('/tournament/' + TOURNAMENT_ID);
      return;
    }
    tournament = data;
    document.getElementById('ictd-loading').style.display = 'none';
    document.getElementById('ictd-content').style.display = 'block';
    render();
  } catch (e) {
    document.getElementById('ictd-loading').innerHTML = `<div class="ic">⚠️</div><div>${escHtml(e.message)}</div>`;
  }
}

function updateCountdown() {
  if (!tournament) return;
  const el = document.getElementById('ictd-countdown-value');
  if (!el) return;
  const now = Date.now();
  const target = tournament.status === 'upcoming' ? tournament.startsAt : (tournament.status === 'active' ? tournament.endsAt : null);
  if (!target) { el.textContent = '—'; return; }
  let diff = Math.max(0, target - now);
  const h = Math.floor(diff / 3600000); diff -= h * 3600000;
  const m = Math.floor(diff / 60000); diff -= m * 60000;
  const s = Math.floor(diff / 1000);
  el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (target - now <= 0 && tournament.status === 'upcoming') loadTournament();
}

    </div>` : '';

  document.getElementById('ictd-content').innerHTML = `
    <div class="ictd-hero">
      <div class="ictd-hero-bg-text">🏰</div>
      <div class="ictd-hero-top">
        <div class="ictd-hero-icon">🏆</div>
        <div class="ictd-hero-info">
          <div class="ictd-badge ${t.status}"><span class="ictd-status-dot"></span>${statusIcon} ${statusLabel}</div>
          <h1 class="ictd-title">${escHtml(t.name)}</h1>
          <div class="ictd-organizer">🛡 ${T('interclub.organized_by')}: <b>${escHtml(t.createdByIsAdmin ? 'Администрация Chess Home' : t.createdBy)}</b>${startsAtStr ? ` &nbsp;·&nbsp; 📅 ${T('interclub.starts_at')}: <b>${escHtml(startsAtStr)}</b>` : ''}</div>
          ${t.description ? `<div class="ictd-desc">${escHtml(t.description)}</div>` : ''}
        </div>
        ${adminBtns}
      </div>
    </div>

    <div class="ictd-stats">
      <div class="ictd-stat"><div class="ictd-stat-label">⏱ ${T('interclub.stat_control')}</div><div class="ictd-stat-value" style="font-family:var(--font-mono)">${escHtml(t.timeControl)}</div></div>
      <div class="ictd-stat"><div class="ictd-stat-label">🛡 ${T('interclub.stat_teams')}</div><div class="ictd-stat-value">${teams.length}</div></div>
      <div class="ictd-stat"><div class="ictd-stat-label">👥 ${T('interclub.stat_players')}</div><div class="ictd-stat-value">${parts.length}</div></div>
      <div class="ictd-stat"><div class="ictd-stat-label">♟ ${T('interclub.stat_games')}</div><div class="ictd-stat-value">${(t.games || []).length}</div></div>
      ${(t.minRating || (t.maxRating && t.maxRating < 9999)) ? `<div class="ictd-stat"><div class="ictd-stat-label">⭐ ${T('interclub.stat_rating')}</div><div class="ictd-stat-value">${t.minRating||0}–${t.maxRating>=9999?'∞':t.maxRating}</div></div>` : ''}
    </div>

    ${t.status !== 'finished' ? `
    <div class="ictd-countdown">
      <div class="ictd-countdown-label">${t.status === 'upcoming' ? T('interclub.countdown_start') : T('interclub.countdown_end')}</div>
      <div class="ictd-countdown-value" id="ictd-countdown-value">--:--:--</div>
    </div>` : ''}

    <div class="ictd-actions-row">
      ${actionBtn}
      ${myPart ? `<div class="ictd-my-team-banner">🎽 ${T('interclub.playing_for')} <b>${escHtml(myTeam ? myTeam.name : T('interclub.team_fallback'))}</b> · ${T('interclub.score_label')}: ${myPart.score || 0}</div>` : ''}
    </div>

    <div class="ictd-teams-row">

function renderStandings(standings, teams, parts, myPart) {
  if (!standings.length) return `<div class="ictd-empty">Нет данных для командного зачёта</div>`;
  return `
    <div class="ictd-standings">
      <div class="ictd-standings-head">
        <span>#</span><span style="text-align:left">Команда</span>
        <span class="hide-mobile">Игроков</span><span class="hide-mobile">Партий</span>
        <span class="hide-mobile">Побед</span><span class="hide-mobile">Пор.</span><span>Очки</span>
      </div>
      ${standings.map((s, i) => {
        const isMine = myPart && myPart.teamId === s.teamId;
        const isOpen = openTeamIds.has(s.teamId);
        const teamParts = parts.filter(p => p.teamId === s.teamId).sort((a,b) => (b.score||0) - (a.score||0));
        return `
        <div class="ictd-team-row${isMine ? ' mine' : ''}${isOpen ? ' open' : ''}" data-team="${escHtml(s.teamId)}">
          <div class="ictd-team-row-main" onclick="toggleTeam('${escHtml(s.teamId)}')">
            <span class="ictd-tr-rank">${i + 1}</span>
            <span class="ictd-tr-name"><span class="ictd-tr-caret">▶</span><span class="tn">${escHtml(s.teamName)}</span></span>
            <span class="hide-mobile">${s.players}</span>
            <span class="hide-mobile">${s.gamesPlayed}</span>
            <span class="hide-mobile ictd-tr-w">${s.wins}</span>
            <span class="hide-mobile ictd-tr-l">${s.losses}</span>
            <span class="ictd-tr-score">${s.score}</span>
          </div>
          <div class="ictd-team-players">
            ${teamParts.length ? teamParts.map((p, pi) => `
              <div class="ictd-player-row">
                <span class="ictd-player-rank">${pi + 1}</span>
                <a class="ictd-player-name" href="/profile/${escHtml(p.username)}">${escHtml(p.username)}${p===myPart?' (вы)':''}</a>
                <span class="ictd-player-status ${p.currentGameId ? 'playing' : p.waiting ? 'waiting' : 'idle'}">${p.currentGameId ? '⚡' : p.left ? 'Покинул' : p.waiting ? '⏳' : p.paused ? '⏸' : ''}</span>
                <span class="ictd-player-score">${p.score || 0}</span>
              </div>`).join('') : `<div class="ictd-team-players-empty">Пока никто не вступил за эту команду</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
function toggleTeam(teamId) {
  if (openTeamIds.has(teamId)) openTeamIds.delete(teamId); else openTeamIds.add(teamId);
  const row = document.querySelector(`.ictd-team-row[data-team="${CSS.escape(teamId)}"]`);
  if (row) row.classList.toggle('open');
}

function renderGamesPlaceholder() {
  return `<div class="ictd-loading" style="padding:40px 0"><div class="ic">⏳</div><div>Загружаем партии...</div></div>`;
}
async function loadGames() {
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID + '/games');
    const games = await safeJson(r);
    const el = document.getElementById('tab-games');
    if (!el) return;
    if (!games.length) { el.innerHTML = `<div class="ictd-empty">Партии ещё не начались</div>`; return; }
    el.innerHTML = `<div class="ictd-games-list">${games.slice().reverse().map(g => `
      <div class="ictd-game-row">
        <div class="ictd-game-players">⚪ ${escHtml(g.white)} &nbsp;vs&nbsp; ⚫ ${escHtml(g.black)}</div>
        <div class="ictd-game-result">${escHtml(resultLabel(g.result))}</div>
        <div class="ictd-game-meta">${g.endedAt ? formatMskShort(g.endedAt) : ''}</div>
      </div>`).join('')}</div>`;
  } catch (e) {
    const el = document.getElementById('tab-games');
    if (el) el.innerHTML = `<div class="ictd-empty">Не удалось загрузить партии</div>`;
  }
}
function resultLabel(r) {
  if (r === 'white') return '1–0';
  if (r === 'black') return '0–1';
  if (r === 'draw') return '½–½';
  return r || '—';
}

async function loadChat() {
  const box = document.getElementById('ictd-chat-msgs');
  if (!box) return;
  if (!currentUser) { box.innerHTML = `<div class="ictd-empty" style="padding:20px">Войдите, чтобы видеть чат турнира</div>`; return; }
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID + '/chat', { credentials: 'same-origin' });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || 'Ошибка');
    box.innerHTML = '';
    (data.messages || []).forEach(appendChatMsg);
  } catch (e) {
    box.innerHTML = `<div class="ictd-empty" style="padding:20px">${escHtml(e.message)}</div>`;
  }
}
function appendChatMsg(msg) {
  const box = document.getElementById('ictd-chat-msgs');
  if (!box) return;
  const div = document.createElement('div');
  div.className = 'ictd-chat-msg' + (msg.system ? ' system' : '');
  div.innerHTML = msg.system ? escHtml(msg.message) : `<span class="u">${escHtml(msg.username)}:</span>${escHtml(msg.message)}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
async function sendChatMsg() {
  const input = document.getElementById('ictd-chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID + '/chat', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || 'Ошибка');
  } catch (e) { toast(e.message, 'error'); }
}

function setTab(name) {
  currentTab = name;
  render();
}

// ── JOIN / LEAVE ──
async function joinFlow() {
  if (!currentUser) { toast('Войдите в аккаунт', 'error'); return; }
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID + '/join', { method: 'POST', credentials: 'same-origin' });
    const data = await safeJson(r);
    if (r.ok) { toast('Вы в турнире! 🎉 Ждите начала', 'success'); loadTournament(); return; }
    if (data.needTeamSelection) {
      if (!data.teams || !data.teams.length) { toast('Вы не состоите ни в одном клубе, который участвует в этом турнире', 'error'); return; }
      openTeamModal(data.teams);
      return;
    }
    throw new Error(data.error || 'Ошибка');
  } catch (e) { toast(e.message, 'error'); }
}
function openTeamModal(teams) {
  joinSelectedTeamId = null;
  const list = document.getElementById('team-select-list');
  list.innerHTML = teams.map(tm => `
    <label class="team-select-option" id="team-opt-${escHtml(tm.id)}" onclick="selectJoinTeam('${escHtml(tm.id)}')">
      <input type="radio" name="join-team" value="${escHtml(tm.id)}">
      <span class="team-select-option-name">${escHtml(tm.name)}</span>
    </label>`).join('');
  document.getElementById('team-modal').classList.add('open');
}
function selectJoinTeam(id) {
  joinSelectedTeamId = id;
  document.querySelectorAll('.team-select-option').forEach(o => o.classList.remove('selected'));
  const opt = document.getElementById('team-opt-' + id);
  if (opt) { opt.classList.add('selected'); opt.querySelector('input').checked = true; }
}
function closeTeamModal() {
  document.getElementById('team-modal').classList.remove('open');
  joinSelectedTeamId = null;
}
async function confirmTeamSelection() {
  if (!joinSelectedTeamId) { toast('Выберите команду', 'error'); return; }
  const btn = document.getElementById('btn-team-confirm');
  btn.disabled = true;
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID + '/join', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teamId: joinSelectedTeamId })
    });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || 'Ошибка');
    toast('Вы в турнире! 🎉 Ждите начала', 'success');
    closeTeamModal();
    loadTournament();
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; }
}
async function leaveTournament() {
  if (!confirm('Покинуть турнир?')) return;
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID + '/leave', { method: 'POST', credentials: 'same-origin' });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || 'Ошибка');
    toast('Вы покинули турнир', 'success');
    loadTournament();
  } catch (e) { toast(e.message, 'error'); }
}
async function deleteTournament() {
  if (!confirm('Удалить турнир безвозвратно?')) return;
  try {
    const r = await fetch(API + '/tournaments/' + TOURNAMENT_ID + '/delete', { method: 'POST', credentials: 'same-origin' });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || 'Ошибка');
    toast('Турнир удалён', 'success');
    setTimeout(() => location.href = "/interclub-tournaments", 1000);
  } catch (e) { toast(e.message, 'error'); }
}

document.getElementById('team-modal').addEventListener('click', function (e) { if (e.target === this) closeTeamModal(); });

// Смена языка — перерисовываем страницу турнира (паттерн blog.html)
document.addEventListener('ch-lang-changed', () => {
  if (tournament) render();
});

init();
</script>
