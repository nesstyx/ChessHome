<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/js/utils.js"></script>
<script src="/js/toast.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="tournaments.detail.page_title">Турнир — Chess Home</title>
  <link rel="stylesheet" href="/css/main.css">
<link rel="icon" type="image/png" href="/img/logo/favicon.png">
  <style>
    body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); }

    .t-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── HERO BANNER ── */
    .t-hero {
      position: relative;
      border-radius: 20px;
      background: linear-gradient(135deg, #1a1c26 0%, #1e2030 40%, #1a1e2c 100%);
      border: 1px solid var(--border-light);
      overflow: hidden;
      padding: 36px 40px;
      margin-bottom: 28px;
    }
    .t-hero::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(201,168,76,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .t-hero-bg-text {
      position: absolute;
      right: 30px; bottom: -20px;
      font-size: 160px;
      opacity: 0.03;
      pointer-events: none;
      user-select: none;
    }

    .t-hero-top {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;            /* issue #22 */
      gap: 20px;
      margin-bottom: 20px;
    }
    .t-hero-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }
    .t-hero-info { flex: 1; min-width: 0; } /* issue #22 */
    .t-hero-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .t-hero-status.active {
      background: rgba(76,175,114,0.15);
      color: var(--green);
      border: 1px solid rgba(76,175,114,0.3);
    }
    .t-hero-status.upcoming {
      background: rgba(201,168,76,0.12);
      color: var(--accent);
      border: 1px solid rgba(201,168,76,0.3);
    }
    .t-hero-status.finished {
      background: rgba(90,94,120,0.15);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .active .status-dot {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulseDot 1.5s infinite;
    }
    .upcoming .status-dot { background: var(--accent); }
    .finished .status-dot { background: var(--text-muted); }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }

    .t-hero-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .t-hero-desc {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }
    .t-hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px 12px;
      margin-bottom: 10px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .t-hero-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .t-hero-meta-item b,
    .t-hero-meta-item a {
      color: var(--text-secondary);
      font-weight: 600;
      text-decoration: none;
    }
    .t-hero-meta-item a:hover { color: var(--accent); }
    .t-hero-meta-item b.admin-name { color: var(--accent); }
    .t-hero-meta-icon { font-size: 12px; opacity: 0.85; }
    .t-hero-meta-sep { opacity: 0.35; }
    .t-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      padding: 6px 12px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
    }
    .t-back-link:hover {
      color: var(--accent);
      background: rgba(201,168,76,0.08);
    }
    .t-hero-disclaimer {
      color: var(--accent);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.25);
    }

    .t-hero-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .t-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      min-width: 96px;
      cursor: default;
      transition: border-color 0.15s, background 0.15s;
    }
    .t-stat:hover {
      border-color: var(--border-light);
      background: rgba(255,255,255,0.04);
    }
    .t-stat-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .t-stat-icon { font-size: 12px; opacity: 0.9; }
    .t-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .t-stat-value.accent { color: var(--accent); }
    .t-stat-value.green  { color: var(--green); }

    .t-hero-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    /* ── TIMER ── */
    .countdown-block {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .countdown-label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }
    .countdown-timer {
      font-size: 22px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--accent);
    }
    .countdown-timer.red { color: var(--red); animation: timerPulse 1s infinite; }
    @keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .progress-bar-wrap {
      flex: 1;
      height: 6px;
      background: var(--bg-card);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent));
      transition: width 1s linear;
    }

    /* ── TABS ── */
    .section-tabs {
      display: flex;
      flex-wrap: wrap;            /* issue #22: табы не выпадают за экран на узких экранах */
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .section-tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      margin-bottom: -1px;
    }
    .section-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .section-tab:hover:not(.active) {
      color: var(--text-primary);
    }

    /* ── TOURNAMENT CHAT ── */
    .t-chat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      height: 480px;
      overflow: hidden;
    }
    .t-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .t-chat-empty {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .t-chat-msg { display: flex; flex-direction: column; gap: 2px; max-width: 100%; }
    .t-chat-msg-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .t-chat-author { font-weight: 700; font-size: 13px; color: var(--text-primary); }
    .t-chat-author.role-admin { color: var(--accent); }
    .t-chat-author.role-creator { color: #5dade2; }
    .t-chat-time { font-size: 11px; color: var(--text-muted); }
    .t-chat-text { font-size: 14px; color: var(--text-secondary); word-break: break-word; white-space: pre-wrap; }
    .t-chat-text.is-muted { color: var(--text-muted); font-style: italic; }
    .t-chat-mod-actions { display: inline-flex; gap: 6px; margin-left: 4px; }
    .t-chat-mod-btn {
      border: none; background: none; cursor: pointer;
      font-size: 11px; color: var(--text-muted); padding: 0 2px;
      transition: color 0.15s;
    }
    .t-chat-mod-btn:hover { color: var(--accent); }
    .t-chat-msg-system {
      align-self: center;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 5px 12px;
      border-radius: 20px;
    }
    .t-chat-composer {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .t-chat-input {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .t-chat-input:focus { border-color: var(--accent); }
    .t-chat-send-btn {
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      background: var(--accent);
      color: #17181f;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.15s;
    }
    .t-chat-send-btn:disabled { opacity: 0.5; cursor: default; }
    .t-chat-closed-banner, .t-chat-muted-banner {
      padding: 12px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    .t-chat-muted-banner { color: #e74c3c; }

    /* ── LEADERBOARD ── */
    .leaderboard {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .lb-row {
      display: grid;
      /* issue #22: minmax(0,1fr) — длинный ник больше не растягивает строку за экран */
      grid-template-columns: 48px minmax(0,1fr) 70px 70px 70px 70px 100px;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      gap: 8px;
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row.header {
      background: var(--bg-secondary);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .lb-row:not(.header):hover { background: var(--bg-hover); }
    .lb-row.me { background: rgba(201,168,76,0.06); }
    .lb-row.top1 { background: linear-gradient(90deg, rgba(201,168,76,0.08), transparent); }
    .lb-row.top2 { background: linear-gradient(90deg, rgba(192,192,192,0.05), transparent); }
    .lb-row.top3 { background: linear-gradient(90deg, rgba(205,127,50,0.05), transparent); }
    .lb-row.banned-player { opacity: 0.35; text-decoration: line-through; display: none; }

    .lb-rank {
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }
    .lb-rank.r1 { color: #ffd700; }
    .lb-rank.r2 { color: #c0c0c0; }
    .lb-rank.r3 { color: #cd7f32; }

    .lb-player {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0; /* issue #22 */
    }
    .lb-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #000;
      flex-shrink: 0;
    }
    .lb-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      min-width: 0;               /* issue #22 */
      overflow-wrap: anywhere;    /* длинные ники переносятся, а не выталкивают строку */
      word-break: break-word;
    }
    .lb-name a {
      color: inherit;
      text-decoration: none;
    }
    .lb-name a:hover { color: var(--accent); }
    .lb-rating {
      font-size: 11px;
      color: var(--text-muted);
    }

    .lb-score {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent);
      text-align: center;
    }
    .lb-num {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
    }

    .flame-badge {
      display: inline-flex;
      align-items: center;
      font-size: 14px;
      animation: flicker 0.8s infinite alternate;
    }
    @keyframes flicker { 0%{opacity:.8;transform:scale(1)} 100%{opacity:1;transform:scale(1.15)} }

    /* playing / waiting indicators */
    .lb-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .lb-status.playing { color: var(--green); }
    .lb-status.waiting { color: var(--accent); }
    .lb-status.idle    { color: var(--text-muted); }

    /* ── GAMES LIST ── */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .game-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;            /* issue #22: пары «белые–чёрные» переносятся на мобильных */
      gap: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .game-item:hover {
      border-color: var(--border-light);
      background: var(--bg-hover);
    }
    .game-item.live {
      border-color: rgba(76,175,114,0.3);
      background: rgba(76,175,114,0.04);
    }
    .game-player {
      flex: 1;
      min-width: 0;               /* issue #22 */
      overflow-wrap: anywhere;
      word-break: break-word;
      font-weight: 600;
      color: var(--text-primary);
    }
    .game-result {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .game-result .vs { color: var(--text-muted); font-size: 11px; }
    .win  { color: var(--green); }
    .loss { color: var(--red); }
    .draw { color: var(--text-secondary); }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(76,175,114,0.15);
      color: var(--green);
      border: 1px solid rgba(76,175,114,0.3);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 10px;
      font-weight: 700;
    }
    .live-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulseDot 1s infinite;
    }

    /* ── BUTTONS ── */
    .btn {
      padding: 10px 22px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #000;
      box-shadow: 0 4px 16px rgba(201,168,76,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(201,168,76,0.45);
    }
    .btn-danger {
      background: rgba(224,85,85,0.12);
      color: var(--red);
      border: 1px solid rgba(224,85,85,0.3);
    }
    .btn-danger:hover {
      background: rgba(224,85,85,0.2);
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--border-light);
      color: var(--text-primary);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ── WINNER MODAL ── */
    .winner-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .winner-overlay.show {
      opacity: 1;
      pointer-events: all;
    }
    .winner-box {
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 0 80px rgba(201,168,76,0.3);
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .winner-trophy { font-size: 64px; display: block; margin-bottom: 16px; }
    .winner-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .winner-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
    }

    /* ── ANTICHEAT BANNER ── */
    .anticheat-banned {
      background: rgba(224,85,85,0.08);
      border: 1px solid rgba(224,85,85,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--red);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── TOAST ── */
    #toast-container {
      position: fixed; bottom: 28px; right: 24px;
      z-index: 9999;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 20px; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      background: var(--bg-card); border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: slideRight 0.3s ease;
      pointer-events: all;
    }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red); }
    @keyframes slideRight { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }

    /* ── ADMIN PANEL ── */
    .admin-panel {
      background: rgba(201,168,76,0.05);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .admin-panel-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .admin-panel-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @keyframes tSpin { to { transform: rotate(360deg); } }
    .section-content { display: none; }
    .section-content.active { display: block; }

    @media (max-width: 700px) {
      .lb-row { grid-template-columns: 36px minmax(0,1fr) 55px 55px; }
      .lb-row .lb-num:nth-child(5),
      .lb-row .lb-num:nth-child(6),
      .lb-row .lb-status { display: none; }
      /* issue #22: у шапки нет классов ячеек — прячем «Ничьи/Поражения/Статус»,
         иначе заголовок остаётся 7-колоночным и рассыпается по строкам */
      .lb-row.header > :nth-child(n+5) { display: none; }
      /* issue #22: «📅 Начало: …» с white-space:nowrap шире экрана телефона */
      .t-hero-meta-item { white-space: normal; }
      .t-hero { padding: 24px 20px; }
      .t-hero-title { font-size: 22px; }
    }
  </style>
</head>
<body>

<script src="/js/header.js"></script>

<div class="t-page">

  <!-- BACK -->
  <a href="/tournaments" class="t-back-link" data-i18n="tournaments.detail.back_link">
    ← Все турниры
  </a>

  <div id="t-content">
    <!-- Loading -->
    <div id="t-loading" style="text-align:center;padding:80px 0;color:var(--text-muted)">
      <div style="font-size:48px;margin-bottom:16px">⏳</div>
      <div data-i18n="tournaments.detail.loading">Загружаем турнир...</div>
    </div>
  </div>
</div>

<!-- WINNER MODAL -->
<div class="winner-overlay" id="winner-overlay">
  <div class="winner-box">
    <span class="winner-trophy">🏆</span>
    <div class="winner-title" data-i18n="tournaments.detail.winner_modal_title">Победитель турнира!</div>
    <div class="winner-name" id="winner-name-display">—</div>
    <button class="btn btn-primary" onclick="document.getElementById('winner-overlay').classList.remove('show')" data-i18n="tournaments.detail.winner_modal_btn">
      🎉 Отлично!
    </button>
  </div>
</div>

<div id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API    = '/api';
// Токен живёт только в HttpOnly-cookie ch_token — браузер шлёт её сам,
// читать/хранить в localStorage больше нечего (и нельзя).
const tId    = location.pathname.split('/').pop();

// Некоторые хостинги/прокси режут методы PATCH/DELETE — запрос не долетает
// до сервера, и в ответ прилетает HTML-страница ошибки вместо JSON. Именно
// это вызывало "JSON.parse: unexpected character at line 1 column 1".
// safeJson не даёт этой "сырой" ошибке всплыть наружу.
// safeJson() — глобальная, из /js/utils.js

let socket   = null;
let tData    = null;
let tClubData = null; // данные клуба, если турнир привязан к клубу (для проверки членства)
let currentUser = null;
let countdownInterval = null;
// Поправка часов: разница «время сервера − время этого компьютера». Без неё у
let serverTimeOffset = 0;
let renderedStatus = null;   // статус, под который сейчас отрисована страница
let _statusRefreshPending = false;
// После 00:00:00 опрашиваем сервер, пока статус турнира не сменится
function scheduleStatusRefresh(prevStatus) {
  if (_statusRefreshPending) return;
  _statusRefreshPending = true;
  let tries = 0;
  const tick = async () => {
    tries++;
    await loadTournament();
    if ((tData && tData.status !== prevStatus) || tries >= 60) { _statusRefreshPending = false; return; }
    setTimeout(tick, 1500);
  };
  setTimeout(tick, 800);
}
let currentSection = 'leaderboard';

// ── ЧАТ ТУРНИРА ──
let chatMessages = [];
let chatCanModerate = false;
let chatMyMuteUntil = 0;
let chatLoadedOnce = false;

// ── AUTH ──
// Хедер (логотип, меню, юзер-меню, счётчик онлайна) теперь полностью
// рисует /js/header.js — здесь только сообщаем ему, кто мы и какая страница активна.
async function init() {
  // Куку ch_token браузер отправит сам — просто спрашиваем сервер, кто мы.
  try {
    const r = await fetch(API + '/me', { credentials: 'same-origin' });
    if (r.ok) currentUser = await safeJson(r);
  } catch {}

  if (window.CH) {
    if (currentUser) CH.setCurrentUser(currentUser);
    CH.setActivePage('tournaments');
  }

  await loadTournament();
  loadTournamentChat();
  connectSocket();
}

async function loadTournament() {
  try {
    const r = await fetch(API + '/tournaments/' + tId);
    if (!r.ok) {
      document.getElementById('t-content').innerHTML = '<div style="text-align:center;padding:80px 0;color:var(--text-muted)"><div style="font-size:48px">🔍</div><div style="margin-top:12px">' + CH_I18N.t('tournaments.detail.not_found') + '</div></div>';
      return;
    }
    tData = await safeJson(r);
    // Время сервера берём из ответа нашего же API (serverNow) — никаких внешних
    // источников. Если у сервера «уплыли» часы, отсчёт идёт по ЕГО времени,
    // и страница больше не зависает на 00:00:00.
    if (typeof tData.serverNow === 'number' && isFinite(tData.serverNow)) {
      serverTimeOffset = tData.serverNow - Date.now();
      if (Math.abs(serverTimeOffset) > 5000) {
        console.warn('[Tournament] Часы сервера отличаются от часов этого устройства на ' + Math.round(serverTimeOffset / 1000) + ' с');
      }
    }
    if (tData.clubId && !tClubData) {
      try {
        const cr = await fetch(API + '/clubs/' + tData.clubId);
        if (cr.ok) tClubData = await safeJson(cr);
      } catch {}
    }
    render();
  } catch (e) {
    console.error(e);
  }
}

// ── SOCKET ──
// ── Запуск турнирной партии — сразу на доску ─────────────────
let _tCdInterval = null; // оставляем для совместимости с clearInterval
function launchTournamentGame(data) {
  // Убираем старый оверлей если есть
  document.getElementById('t-cd-overlay')?.remove();
  clearInterval(_tCdInterval);
  // Кладём данные в sessionStorage — app.js подхватит и запустит игру
  try { sessionStorage.setItem('ch_launch_game', JSON.stringify(data)); } catch(e) {}
  window.location.href = '/';
}

// ── Баннер статуса ────────────────────────────────────────────
let _graceBannerTimer = null; // тикает раз в секунду, пока идёт отсчёт грейс-периода после партии
function updateMyStatusBanner() {
  const me = currentUser && currentUser.username;
  if (!me || !tData || tData.status !== 'active') {
    const b = document.getElementById('my-status-banner');
    if (b) b.style.display = 'none';
    return;
  }
  const myPart = tData.participants && tData.participants.find(function(p){ return p.username === me; });
  if (!myPart || myPart.left || myPart.anticheatBanned) {
    const b = document.getElementById('my-status-banner');
    if (b) b.style.display = 'none';
    return;
  }

  let banner = document.getElementById('my-status-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'my-status-banner';
    const tabs = document.querySelector('.section-tabs');
    if (tabs) tabs.parentNode.insertBefore(banner, tabs);
    else document.getElementById('t-content') && document.getElementById('t-content').prepend(banner);
  }

  const BASE = 'border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;border:1px solid ';

  const isReallyPlaying = myPart.currentGameId &&
    tData.participants.some(function(o){ return o.username !== me && o.currentGameId === myPart.currentGameId; });

  const graceLeft = myPart.nextEligibleAt ? myPart.nextEligibleAt - Date.now() : 0;
  clearTimeout(_graceBannerTimer);

  if (isReallyPlaying) {
    banner.style.cssText = BASE + 'rgba(76,175,114,0.35);background:rgba(76,175,114,0.08)';
    banner.innerHTML = '<span style="font-size:22px">⚡</span><div style="flex:1"><div style="color:var(--green)">' + CH_I18N.t('tournaments.detail.status_banner.playing_title') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + CH_I18N.t('tournaments.detail.status_banner.playing_sub') + '</div></div><a href="/game/' + myPart.currentGameId + '" class="btn btn-primary" style="font-size:12px;padding:7px 14px">' + CH_I18N.t('tournaments.detail.status_banner.go_to_game_btn') + '</a>';
  } else if (myPart.waiting && graceLeft > 0) {
    banner.style.cssText = BASE + 'rgba(201,168,76,0.3);background:rgba(201,168,76,0.07)';
    const secs = Math.ceil(graceLeft / 1000);
    banner.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(201,168,76,0.3);border-top-color:var(--accent);border-radius:50%;animation:tSpin 0.8s linear infinite;flex-shrink:0"></div><div style="flex:1"><div style="color:var(--accent)">' + CH_I18N.t('tournaments.detail.status_banner.next_game_in_prefix') + secs + CH_I18N.t('tournaments.detail.status_banner.next_game_in_suffix') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + CH_I18N.t('tournaments.detail.status_banner.next_game_hint') + '</div></div><button onclick="pauseTournament()" class="btn btn-secondary" style="font-size:12px;padding:7px 14px">' + CH_I18N.t('tournaments.detail.status_banner.pause_btn') + '</button>';
    // Перерисовываем раз в секунду, пока идёт отсчёт — свежего tournament_update от сервера в это время не будет
    _graceBannerTimer = setTimeout(updateMyStatusBanner, 1000);
  } else if (myPart.waiting) {
    banner.style.cssText = BASE + 'rgba(201,168,76,0.3);background:rgba(201,168,76,0.07)';
    banner.innerHTML = '<div style="width:18px;height:18px;border:2px solid rgba(201,168,76,0.3);border-top-color:var(--accent);border-radius:50%;animation:tSpin 0.8s linear infinite;flex-shrink:0"></div><div style="flex:1"><div style="color:var(--accent)">' + CH_I18N.t('tournaments.detail.status_banner.searching_opponent') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + CH_I18N.t('tournaments.detail.status_banner.searching_hint') + '</div></div><button onclick="pauseTournament()" class="btn btn-secondary" style="font-size:12px;padding:7px 14px">' + CH_I18N.t('tournaments.detail.status_banner.pause_btn') + '</button>';
  } else {
    banner.style.cssText = BASE + 'var(--border);background:var(--bg-secondary)';
    const pauseLabel = myPart.paused
      ? '<div style="color:var(--text-secondary)">' + CH_I18N.t('tournaments.detail.status_banner.paused_title') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + CH_I18N.t('tournaments.detail.status_banner.paused_hint') + '</div>'
      : '<div style="color:var(--text-secondary)">' + CH_I18N.t('tournaments.detail.status_banner.finished_title') + '</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:400">' + CH_I18N.t('tournaments.detail.status_banner.finished_hint') + '</div>';
    banner.innerHTML = '<span style="font-size:22px">⏸</span><div style="flex:1">' + pauseLabel + '</div><button onclick="resumeTournament()" class="btn btn-primary" style="font-size:12px;padding:7px 14px">' + CH_I18N.t('tournaments.detail.status_banner.play_btn') + '</button>';
  }
  banner.style.display = 'flex';
}

// pendingResume: если игрок нажал "Играть" до auth_ok — запомним и выполним после
let _pendingResume = false;

function pauseTournament()  {
  if (socket && socket.connected) socket.emit('tournament_unseek', tId);
}
function resumeTournament() {
  if (socket && socket.username) {
    // сокет авторизован — сразу шлём
    socket.emit('tournament_waiting', { tournamentId: tId });
  } else if (socket && socket.connected) {
    // подключён но ещё не прошёл auth — запомним, отправим в auth_ok
    _pendingResume = true;
  }
}

function connectSocket() {
  socket = io(); // кука ch_token уедет вместе с handshake автоматически (тот же origin)

  socket.on('disconnect', function () {
    // Сбрасываем, чтобы после реального обрыва связи резюме-логика снова
    // корректно ждала свежий auth_ok, а не работала со старым (уже невалидным) именем.
    socket.username = null;
  });

  socket.on('connect', function () {
    // Сервер всё равно читает токен только из HttpOnly-cookie handshake,
    // а не из этого аргумента — но событие 'auth' обязательно нужно прислать,
    // чтобы сервер начал сессию.
    socket.emit('auth', null);
  });

  socket.on('auth_ok', function (data) {
    socket.username = (data && data.username) || (currentUser && currentUser.username) || socket.username;
    socket.emit('join_tournament_room', tId);
    if (tData && tData.status === 'active') {
      const me = currentUser && currentUser.username;
      const myPart = me && tData.participants && tData.participants.find(function(p){ return p.username === me; });
      if (myPart && !myPart.left && !myPart.anticheatBanned) {
        if (myPart.currentGameId) {
          // Пара уже создана на сервере, но клиент мог не успеть получить game_start — запросим явно
          socket.emit('tournament_rejoin', { tournamentId: tId, gameId: myPart.currentGameId });
        } else if (_pendingResume) {
          // Игрок нажал "Играть" пока авторизация ещё шла
          _pendingResume = false;
          socket.emit('tournament_waiting', { tournamentId: tId });
        } else if (myPart.waiting && !myPart.paused) {
          // Восстанавливаем seek после реконнекта
          socket.emit('tournament_waiting', { tournamentId: tId });
        }
        // Если paused=true — игрок сам нажмёт "Играть" (не форсируем)
      }
    }
  });

  // game_start — сразу на доску
  socket.on('game_start', function (data) {
    if (!data.tournamentId || data.tournamentId !== tId) return;
    if (data.moves && data.moves.length > 0) {
      // Реджойн — сохраняем и переходим на главную
      try { sessionStorage.setItem('ch_launch_game', JSON.stringify(data)); } catch(e) {}
      window.location.href = '/';
      return;
    }
    launchTournamentGame(data);
  });

  socket.on('tournament_update', function (data) {
    const me = currentUser && currentUser.username;
    const prevPart = tData && tData.participants && tData.participants.find(function(p){ return p.username === me; });
    const prevGameId = prevPart ? prevPart.currentGameId : null;
    tData = data;
    // Сервер сменил статус (upcoming → active и т.д.), а страница ещё показывает
    // старый отсчёт — перезагружаем турнир целиком.
    if (renderedStatus && data && data.status && data.status !== renderedStatus) loadTournament();
    renderLeaderboard();
    renderGames();
    updateHeroStats();
    updateMyStatusBanner();

    // Если у нас появилась новая партия (currentGameId), но клиент не получил game_start
    // (например, socket не успел авторизоваться к моменту спаринга на сервере) — запрашиваем старт партии вручную
    const myPart = me && data.participants && data.participants.find(function(p){ return p.username === me; });
    if (myPart && myPart.currentGameId && myPart.currentGameId !== prevGameId && socket && socket.username) {
      socket.emit('tournament_rejoin', { tournamentId: tId, gameId: myPart.currentGameId });
    }
  });

  socket.on('tournament_started', function (data) {
    if (!data || data.tournamentId !== tId) return;
    loadTournament();
  });

  socket.on('tournament_finished', function (data) {
    if ((data.tournament && data.tournament.id === tId) || data.winner) {
      tData = data.tournament || tData;
      if (tData && tData.winner) showWinner(tData.winner);
      render();
    }
  });

  socket.on('anticheat_ban', function (data) {
    toast('⚠️ ' + data.username + ' ' + CH_I18N.t('tournaments.detail.anticheat_banned_suffix'), 'error');
    loadTournament();
  });

  // ── Чат турнира ──
  socket.on('tournament_chat_msg', function (data) {
    if (!data || data.tournamentId !== tId) return;
    chatMessages.push(data.msg);
    if (chatMessages.length > 50) chatMessages.shift();
    renderChatMessages();
  });

  socket.on('tournament_chat_user_muted', function (data) {
    if (!data || data.tournamentId !== tId) return;
    const wipedIds = new Set(data.mutedIds || []);
    chatMessages.forEach(function (m) {
      if (wipedIds.has(m.id)) { m.message = '[' + CH_I18N.t('tournaments.detail.chat.muted_tag') + ']'; m.muted = true; }
    });
    if (data.sysMsg) {
      chatMessages.push(data.sysMsg);
      if (chatMessages.length > 50) chatMessages.shift();
    }
    const me = currentUser && currentUser.username;
    if (me && data.username && me.toLowerCase() === data.username.toLowerCase()) {
      chatMyMuteUntil = data.until;
      renderChatComposer();
      toast('🔇 ' + CH_I18N.t('tournaments.detail.chat.you_muted'), 'error');
    }
    renderChatMessages();
  });

  socket.on('tournament_chat_user_unmuted', function (data) {
    if (!data || data.tournamentId !== tId) return;
    const me = currentUser && currentUser.username;
    if (me && data.username && me.toLowerCase() === data.username.toLowerCase()) {
      chatMyMuteUntil = 0;
      renderChatComposer();
      toast('🔊 ' + CH_I18N.t('tournaments.detail.chat.you_unmuted'), 'success');
    }
  });
}

// ── Может ли текущий пользователь управлять этим турниром: сайт-админ
// ИЛИ администратор клуба, к которому привязан турнир (создатель клуба
// всегда входит в список админов клуба).
function canManageThisTournament() {
  if (!currentUser) return false;
  if (currentUser.role === 'admin') return true;
  if (tData?.clubId && tClubData) {
    const lname = currentUser.username.toLowerCase();
    return (tClubData.admins || []).map(a => a.toLowerCase()).includes(lname);
  }
  return false;
}

// ── MAIN RENDER ──
function render() {
  if (!tData) return;
  const status = tData.status;
  const isAdmin = canManageThisTournament();
  const me = currentUser?.username;
  const myPart = tData.participants?.find(p => p.username === me);
  const isInTournament = !!myPart && !myPart.left;
  const canJoin = currentUser && !isInTournament && status !== 'finished';

  // Check blacklist
  const isBlacklisted = tData.blacklist?.includes(me?.toLowerCase());

  // Rating check
  const myRating = currentUser?.rating || 0;
  const ratingOk = (!tData.minRating || myRating >= tData.minRating) &&
                   (!tData.maxRating || tData.maxRating >= 9999 || myRating <= tData.maxRating);

  // Клубное ограничение: участвовать могут только члены клуба
  let clubOk = true;
  if (tData.clubOnly && tData.clubId) {
    const members = (tClubData?.members || []).map(m => m.toLowerCase());
    clubOk = !!currentUser && members.includes(currentUser.username.toLowerCase());
  }

  document.getElementById('t-loading').style.display = 'none';
  document.getElementById('t-content').innerHTML = buildHTML(status, isAdmin, myPart, canJoin && !isBlacklisted && ratingOk && clubOk);

  renderedStatus = status;
  startCountdown(status);

  if (tData.winner && status === 'finished') {
    setTimeout(() => showWinner(tData.winner), 500);
  }

  document.querySelectorAll('.section-tab').forEach(t => {
    t.addEventListener('click', () => switchSection(t.dataset.section));
  });

  switchSection(currentSection);
  setTimeout(updateMyStatusBanner, 0);
}

function buildHTML(status, isAdmin, myPart, canJoin) {
  const statusLabel = { active:CH_I18N.t('tournaments.status.active'), upcoming:CH_I18N.t('tournaments.status.upcoming'), finished:CH_I18N.t('tournaments.status.finished') }[status] || status;
  const statusIcon  = { active:'⚡', upcoming:'🕐', finished:'🏁' }[status];
  const parts = tData.participants || [];
  const activeParts = parts.filter(p => !p.anticheatBanned);

  // ── Организатор турнира ──
  // Бэкенд помечает турниры, созданные администрацией, флагом createdByIsAdmin.
  // Ник создателя может приходить в разных полях в зависимости от версии API —
  // берём первое, что есть.
  const creatorName = tData.createdBy || tData.creatorUsername || tData.organizer || tData.ownerUsername;
  const organizerHtml = tData.createdByIsAdmin
    ? `<div class="t-hero-meta-item" title="${CH_I18N.t('tournaments.detail.organizer.chesshome_title')}">
         <span class="t-hero-meta-icon">🛡</span>${CH_I18N.t('tournaments.detail.organizer.label')} <b class="admin-name">${CH_I18N.t('tournaments.detail.organizer.chesshome_name')}</b>
       </div>`
    : creatorName
      ? `<div class="t-hero-meta-item" title="${CH_I18N.t('tournaments.detail.organizer.creator_title')}">
           <span class="t-hero-meta-icon">👤</span>${CH_I18N.t('tournaments.detail.organizer.label')}
           <a href="/profile/${encodeURIComponent(creatorName)}">${escapeHtml(creatorName)}</a>
         </div>`
      : '';

  const dtLocale = CH_I18N.getLang() === 'ru' ? 'ru-RU' : 'en-US';
  const startsAtStr = tData.startsAt ? new Date(tData.startsAt).toLocaleString(dtLocale, {
    day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow'
  }) + ' МСК' : '';
  const startsAtHtml = startsAtStr
    ? `<div class="t-hero-meta-item" title="${CH_I18N.t('tournaments.detail.starts_at.title')}">
         <span class="t-hero-meta-icon">📅</span>${status === 'finished' ? CH_I18N.t('tournaments.detail.starts_at.started_label') : CH_I18N.t('tournaments.detail.starts_at.starts_label')}: <b>${escapeHtml(startsAtStr)}</b>
       </div>`
    : '';

  // ── Клубный турнир ──
  const clubHtml = tData.clubId
    ? `<div class="t-hero-meta-item" title="${CH_I18N.t('tournaments.detail.club.title')}">
         <span class="t-hero-meta-icon">🛡</span>${CH_I18N.t('tournaments.detail.club.label')}
         <a href="/clubs/${escapeHtml(tData.clubId)}">${escapeHtml(tClubData ? tClubData.name : CH_I18N.t('tournaments.detail.club.fallback_name'))}</a>
       </div>`
    : '';
  const clubOnlyNotice = (tData.clubOnly && tData.clubId)
    ? `<div class="t-hero-disclaimer" style="border-color:rgba(93,173,226,0.35);background:rgba(93,173,226,0.08);color:#5dade2">
         🔒 ${CH_I18N.t('tournaments.detail.club.only_notice_prefix')}«${escapeHtml(tClubData ? tClubData.name : '')}»
       </div>`
    : '';

  return `
    <!-- HERO -->
    <div class="t-hero">
      <div class="t-hero-bg-text">♛</div>
      <div class="t-hero-top">
        <div class="t-hero-icon">🏆</div>
        <div class="t-hero-info">
          <div class="t-hero-status ${status}">
            <span class="status-dot"></span>
            ${statusIcon} ${statusLabel}
          </div>
          <div class="t-hero-title">${escapeHtml(tData.name)}</div>

function buildLeaderboard() {
  const parts = [...(tData.participants || [])].filter(p => !p.anticheatBanned);
  if (!parts.length) {
    return `<div style="text-align:center;padding:48px;color:var(--text-muted)">
      <div style="font-size:40px;margin-bottom:12px">👥</div>
      <div>${CH_I18N.t('tournaments.detail.leaderboard.no_participants')}</div>
    </div>`;
  }
  parts.sort((a,b) => b.score - a.score || b.wins - a.wins || a.losses - b.losses);
  const me = currentUser?.username;
  const isAdmin = canManageThisTournament();

  const rows = parts.map((p, i) => {
    const rank = i + 1;
    const rankDisplay = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
    const rowClass = [
      rank<=3 ? 'top'+rank : '',
      p.username === me ? 'me' : '',
    ].filter(Boolean).join(' ');

    const statusHtml = p.currentGameId
      ? `<span class="lb-status playing">⚡ ${CH_I18N.t('tournaments.detail.leaderboard.status.playing')}</span>`
      : p.waiting
        ? `<span class="lb-status waiting">⏳ ${CH_I18N.t('tournaments.detail.leaderboard.status.waiting')}</span>`
        : p.left
          ? `<span class="lb-status idle">${CH_I18N.t('tournaments.detail.leaderboard.status.left')}</span>`
          : p.paused
            ? `<span class="lb-status idle">⏸ ${CH_I18N.t('tournaments.detail.leaderboard.status.paused')}</span>`
            : `<span class="lb-status idle">—</span>`;

    const adminBanBtn = isAdmin && p.username !== me
      ? `<button onclick="adminBanFromTournament('${escapeHtml(p.username)}')" class="btn btn-danger" style="font-size:10px;padding:2px 7px;margin-left:6px;border-radius:6px" title="${CH_I18N.t('tournaments.detail.leaderboard.ban_btn_title')}">🚫</button>`
      : '';

    return `
      <div class="lb-row ${rowClass}">
        <div class="lb-rank ${rankClass}">${rankDisplay}</div>
        <div class="lb-player">
          <div class="lb-avatar">${p.username[0].toUpperCase()}</div>
          <div>
            <div class="lb-name" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
              <a href="/profile/${encodeURIComponent(p.username)}">${escapeHtml(p.username)}</a>
              ${p.flame ? '<span class="flame-badge">🔥</span>' : ''}
              ${p.username === me ? '<span style="font-size:10px;color:var(--accent)">' + CH_I18N.t('tournaments.detail.leaderboard.you_badge') + '</span>' : ''}
              ${adminBanBtn}
            </div>
            <div class="lb-rating">★ ${p.rating || '?'}</div>
          </div>
        </div>
        <div class="lb-score">${p.score}</div>
        <div class="lb-num" style="color:var(--green)">${p.wins}</div>
        <div class="lb-num" style="color:var(--text-muted)">${p.draws}</div>
        <div class="lb-num" style="color:var(--red)">${p.losses}</div>
        ${statusHtml}
      </div>`;
  }).join('');

  return `
    <div class="leaderboard">
      <div class="lb-row header">
        <div style="text-align:center">#</div>
        <div>${CH_I18N.t('tournaments.detail.leaderboard.header.player')}</div>
        <div style="text-align:center">${CH_I18N.t('tournaments.detail.leaderboard.header.score')}</div>
        <div style="text-align:center">${CH_I18N.t('tournaments.detail.leaderboard.header.wins')}</div>
        <div style="text-align:center">${CH_I18N.t('tournaments.detail.leaderboard.header.draws')}</div>
        <div style="text-align:center">${CH_I18N.t('tournaments.detail.leaderboard.header.losses')}</div>
        <div>${CH_I18N.t('tournaments.detail.leaderboard.header.status')}</div>
      </div>
      ${rows}
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--text-muted);text-align:center">
      ${CH_I18N.t('tournaments.detail.leaderboard.scoring_note')}
    </div>`;
}

function buildGames() {
  const games = [...(tData.games || [])].reverse();
  // Also show active tournament games
  const liveGames = (tData.participants || [])
    .filter(p => p.currentGameId)
    .map(p => ({ id: p.currentGameId, live: true, white: '?', black: p.username }));

  if (!games.length && !liveGames.length) {
    return `<div style="text-align:center;padding:48px;color:var(--text-muted)">
      <div style="font-size:40px;margin-bottom:12px">♟</div>
      <div>${CH_I18N.t('tournaments.detail.games.none')}</div>
    </div>`;
  }

  // Live games first
  const liveHTML = liveGames.map(g => `
    <a class="game-item live" href="/game/${g.id}">
      <span class="live-badge"><span class="live-dot"></span> LIVE</span>
      <span class="game-player">${CH_I18N.t('tournaments.detail.games.in_progress')}</span>
      <span style="font-size:12px;color:var(--green)">${CH_I18N.t('tournaments.detail.games.watch_btn')}</span>
    </a>`).join('');

  const gamesHTML = games.slice(0, 50).map(g => {
    const res = g.result === 'white' ? ['win','','loss'] :
                g.result === 'black' ? ['loss','','win'] :
                g.result === 'draw'  ? ['draw','','draw'] : ['','vs',''];
    const banned = g.anticheatBanned;
    return `
      <a class="game-item" href="/game/${g.id}">
        <span class="game-player ${res[0]}">${escapeHtml(g.white)}</span>
        <span class="game-result">
          <span class="${res[0]}">${g.result==='white'?'1':g.result==='draw'?'½':'0'}</span>
          <span class="vs">—</span>
          <span class="${res[2]}">${g.result==='black'?'1':g.result==='draw'?'½':'0'}</span>
        </span>
        <span class="game-player ${res[2]}" style="text-align:right">${escapeHtml(g.black)}</span>
        ${banned ? '<span style="color:var(--red);font-size:11px">⚠️ ' + CH_I18N.t('tournaments.detail.games.anticheat_flag') + '</span>' : ''}
      </a>`;
  }).join('');

  return `<div class="games-list">${liveHTML}${gamesHTML}</div>`;
}

// ── ЧАТ ТУРНИРА ──
// Открыт: до турнира, во время и ещё 3 часа после его окончания.
function isTournamentChatOpenNow() {
  if (!tData || !tData.endsAt) return true;
  return Date.now() < (tData.endsAt + 3 * 60 * 60 * 1000);
}

function buildChat() {
  return `
    <div class="t-chat-box">
      <div class="t-chat-messages" id="chat-messages-list">${buildChatMessagesHtml()}</div>
      <div id="chat-composer">${buildChatComposerHtml()}</div>
    </div>`;
}

function chatAuthorClass(m) {
  if (m.role === 'admin') return 'role-admin';
  if (tData && tData.createdBy && m.username && tData.createdBy.toLowerCase() === m.username.toLowerCase()) return 'role-creator';
  return '';
}

function buildChatMessagesHtml() {
  if (!chatMessages.length) {
    return `<div class="t-chat-empty">💬 ${CH_I18N.t('tournaments.detail.chat.empty')}</div>`;
  }
  return chatMessages.map(m => {
    if (m.system) {
      return `<div class="t-chat-msg-system">${escapeHtml(m.message)}</div>`;
    }
    const time = new Date(m.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const modActions = chatCanModerate
      ? `<span class="t-chat-mod-actions">
           <button class="t-chat-mod-btn" title="${CH_I18N.t('tournaments.detail.chat.mute_btn_title')}" onclick="promptMuteTournamentUser('${escapeHtml(m.username)}')">🔇 ${CH_I18N.t('tournaments.detail.chat.mute_btn')}</button>
           ${m.muted ? `<button class="t-chat-mod-btn" title="${CH_I18N.t('tournaments.detail.chat.unmute_btn_title')}" onclick="unmuteTournamentUser('${escapeHtml(m.username)}')">🔓 ${CH_I18N.t('tournaments.detail.chat.unmute_btn')}</button>` : ''}
         </span>`
      : '';
    return `
      <div class="t-chat-msg">
        <div class="t-chat-msg-head">
          <a class="t-chat-author ${chatAuthorClass(m)}" href="/profile/${encodeURIComponent(m.username)}">${escapeHtml(m.username)}</a>
          <span class="t-chat-time">${time}</span>
          ${modActions}
        </div>
        <div class="t-chat-text${m.muted ? ' is-muted' : ''}">${escapeHtml(m.message)}</div>
      </div>`;
  }).join('');
}

function buildChatComposerHtml() {
  if (!currentUser) {
    return `<div class="t-chat-closed-banner">${CH_I18N.t('tournaments.detail.chat.login_required')}</div>`;
  }
  if (!isTournamentChatOpenNow()) {
    return `<div class="t-chat-closed-banner">🔒 ${CH_I18N.t('tournaments.detail.chat.closed')}</div>`;
  }
  if (chatMyMuteUntil && chatMyMuteUntil > Date.now()) {
    const dtLocale = CH_I18N.getLang() === 'ru' ? 'ru-RU' : 'en-US';
    const until = new Date(chatMyMuteUntil).toLocaleString(dtLocale, { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    return `<div class="t-chat-muted-banner">🔇 ${CH_I18N.t('tournaments.detail.chat.muted_until_prefix')}${escapeHtml(until)}</div>`;
  }
  return `
    <div class="t-chat-composer">
      <input class="t-chat-input" id="chat-input" type="text" maxlength="300" placeholder="${CH_I18N.t('tournaments.detail.chat.input_placeholder')}" onkeydown="if(event.key==='Enter'){event.preventDefault();sendTournamentChatMessage();}">
      <button class="t-chat-send-btn" id="chat-send-btn" onclick="sendTournamentChatMessage()">${CH_I18N.t('tournaments.detail.chat.send_btn')}</button>
    </div>`;
}

function renderChatMessages() {
  const el = document.getElementById('chat-messages-list');
  if (!el) return;
  el.innerHTML = buildChatMessagesHtml();
  scrollChatToBottom();
}
function renderChatComposer() {
  const el = document.getElementById('chat-composer');
  if (el) el.innerHTML = buildChatComposerHtml();
}
function scrollChatToBottom() {
  const el = document.getElementById('chat-messages-list');
  if (el) el.scrollTop = el.scrollHeight;
}

async function loadTournamentChat() {
  try {
    const r = await fetch(API + '/tournaments/' + tId + '/chat', { credentials: 'same-origin' });
    if (!r.ok) return;
    const data = await safeJson(r);
    chatMessages = data.messages || [];
    chatCanModerate = !!data.canModerate;
    chatMyMuteUntil = data.myMute ? data.myMute.until : 0;
    chatLoadedOnce = true;
    renderChatMessages();
    renderChatComposer();
  } catch (e) { console.error(e); }
}

async function sendTournamentChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const btn = document.getElementById('chat-send-btn');
  input.disabled = true;
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(API + '/tournaments/' + tId + '/chat', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await safeJson(r);
    if (!r.ok) {
      toast(data.error || CH_I18N.t('tournaments.detail.chat.send_failed'), 'error');
      if (data.until) { chatMyMuteUntil = data.until; renderChatComposer(); return; }
    } else {
      input.value = '';
    }
  } catch (e) {
    toast(CH_I18N.t('tournaments.detail.chat.network_error'), 'error');
  }
  input.disabled = false;
  if (btn) btn.disabled = false;
  input.focus();
}

function promptMuteTournamentUser(username) {
  const minutes = prompt(CH_I18N.t('tournaments.detail.chat.mute_prompt', { username }), '15');
  if (minutes === null) return;
  const mins = parseInt(minutes, 10);
  if (!mins || mins < 1) { toast(CH_I18N.t('tournaments.detail.chat.invalid_value'), 'error'); return; }
  fetch(API + '/tournaments/' + tId + '/chat-mute', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, minutes: mins })
  }).then(safeJson).then(data => {
    if (data.error) toast(data.error, 'error');
    else toast('🔇 ' + CH_I18N.t('tournaments.detail.chat.muted_success', { username, mins }), 'success');
  }).catch(() => toast(CH_I18N.t('tournaments.detail.chat.network_error'), 'error'));
}

function unmuteTournamentUser(username) {
  fetch(API + '/tournaments/' + tId + '/chat-unmute', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username })
  }).then(safeJson).then(data => {
    if (data.error) toast(data.error, 'error');
    else toast('🔊 ' + CH_I18N.t('tournaments.detail.chat.unmuted_success', { username }), 'success');
  }).catch(() => toast(CH_I18N.t('tournaments.detail.chat.network_error'), 'error'));
}

// ── SECTION SWITCH ──
function switchSection(name) {
  currentSection = name;
  document.querySelectorAll('.section-tab').forEach(t => t.classList.toggle('active', t.dataset.section === name));
  document.querySelectorAll('.section-content').forEach(c => c.classList.toggle('active', c.id === 'section-' + name));
  if (name === 'chat') {
    if (!chatLoadedOnce) loadTournamentChat();
    else scrollChatToBottom();
  }
}

// ── COUNTDOWN ──
function startCountdown(status) {
  clearInterval(countdownInterval);
  if (status === 'finished') return;
  const el = document.getElementById('countdown-timer');
  const fill = document.getElementById('progress-fill');
  if (!el) return;

  countdownInterval = setInterval(() => {
    const now = Date.now() + serverTimeOffset;
    let ms, total;
    if (status === 'active') {
      ms = Math.max(0, tData.endsAt - now);
      total = tData.durationMinutes * 60000;
      const pct = Math.max(0, Math.min(100, 100 - (ms / total * 100)));
      if (fill) fill.style.width = pct + '%';
    } else {
      ms = Math.max(0, tData.startsAt - now);
    }
    el.textContent = formatMs(ms);
    el.className = 'countdown-timer' + (ms < 60000 ? ' red' : '');
    if (ms <= 0) {
      clearInterval(countdownInterval);
      scheduleStatusRefresh(status);
    }
  }, 1000);
}

function formatMs(ms) {
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

// ── JOIN / LEAVE ──
async function joinTournament() {
  if (!currentUser) { toast(CH_I18N.t('tournaments.detail.join.login_required'), 'error'); return; }
  const btn = document.getElementById('btn-join');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(API + '/tournaments/' + tId + '/join', {
      method: 'POST',
      credentials: 'same-origin'
    });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || CH_I18N.t('tournaments.error.generic'));
    toast(CH_I18N.t('tournaments.detail.join.success'), 'success');
    await loadTournament();
  } catch (e) {
    toast(e.message, 'error');
    if (btn) btn.disabled = false;
  }
}

async function leaveTournament() {
  if (!confirm(CH_I18N.t('tournaments.detail.leave.confirm'))) return;
  try {
    const r = await fetch(API + '/tournaments/' + tId + '/leave', {
      method: 'POST',
      credentials: 'same-origin'
    });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || CH_I18N.t('tournaments.error.generic'));
    toast(CH_I18N.t('tournaments.detail.leave.success'), 'success');
    await loadTournament();
  } catch (e) { toast(e.message, 'error'); }
}

// ── ADMIN ──
async function adminDeleteTournament() {
  if (!confirm(CH_I18N.t('tournaments.detail.admin_actions.delete_confirm'))) return;
  try {
    // Некоторые хостинги/прокси режут метод DELETE — шлём POST на /delete,
    // для которого на сервере есть специальный дублёр-обработчик.
    const r = await fetch(API + '/tournaments/' + tId + '/delete', {
      method: 'POST',
      credentials: 'same-origin'
    });
    if (!r.ok) throw new Error((await safeJson(r)).error);
    toast(CH_I18N.t('tournaments.detail.admin_actions.deleted'), 'success');
    setTimeout(() => window.location.href = '/tournaments', 1200);
  } catch (e) { toast(e.message, 'error'); }
}

// Замените старую adminEditTournament
function adminEditTournament() {
  if (!tData) return;
  // Заполняем форму текущими данными
  document.getElementById('edit-name').value = tData.name || '';
  document.getElementById('edit-desc').value = tData.description || '';
  document.getElementById('edit-tc').value = tData.timeControl || '3+2';
  document.getElementById('edit-duration').value = tData.durationMinutes || 30;
  // Дата начала — преобразуем в формат datetime-local, ПОКАЗЫВАЕМ ИМЕННО МСК
  // (а не локальное время браузера того, кто открыл форму редактирования).
  // Россия не переходит на летнее/зимнее время с 2014 года, поэтому смещение
  // МСК = UTC+3 можно считать постоянным.
  if (tData.startsAt) {
    const MSK_OFFSET_MS = 3 * 60 * 60 * 1000;
    const d = new Date(tData.startsAt + MSK_OFFSET_MS);
    const pad = n => String(n).padStart(2, '0');
    const mskLocalValue = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
    document.getElementById('edit-starts-at').value = mskLocalValue;
  }
  document.getElementById('edit-max').value = tData.maxParticipants || 0;
  document.getElementById('edit-min-rating').value = tData.minRating || 0;
  document.getElementById('edit-max-rating').value = (tData.maxRating && tData.maxRating < 9999) ? tData.maxRating : 0;
  // Blacklist
  editBlacklist = (tData.blacklist || []).slice();
  renderEditBlacklist();

  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
}

// Blacklist для редактирования
let editBlacklist = [];

function addEditBlacklist() {
  const input = document.getElementById('edit-bl-input');
  const val = input.value.trim();
  if (!val || editBlacklist.includes(val.toLowerCase())) { input.value = ''; return; }
  editBlacklist.push(val.toLowerCase());
  input.value = '';
  renderEditBlacklist();
}
function removeEditBlacklist(name) {
  editBlacklist = editBlacklist.filter(b => b !== name);
  renderEditBlacklist();
}
function renderEditBlacklist() {
  const el = document.getElementById('edit-bl-tags');
  el.innerHTML = editBlacklist.map(n => `
    <span class="bl-tag">
      ${escapeHtml(n)}
      <span class="bl-tag-remove" onclick="removeEditBlacklist('${escapeHtml(n)}')">✕</span>
    </span>`).join('');
}

async function submitEditTournament() {
  const btn = document.getElementById('btn-edit-submit');
  btn.disabled = true;
  btn.textContent = CH_I18N.t('tournaments.detail.admin_actions.saving_btn');

  const payload = {
    name: document.getElementById('edit-name').value.trim(),
    description: document.getElementById('edit-desc').value.trim(),
    timeControl: document.getElementById('edit-tc').value,
    durationMinutes: parseInt(document.getElementById('edit-duration').value),
    // Значение datetime-local — это "голые" цифры без часового пояса.
    // Мы трактуем их как МСК и явно добавляем смещение +03:00, чтобы
    // new Date(...) на сервере (в любом его часовом поясе) распарсил
    // время однозначно и без сюрпризов.
    startsAt: document.getElementById('edit-starts-at').value
      ? document.getElementById('edit-starts-at').value + ':00+03:00'
      : '',
    maxParticipants: parseInt(document.getElementById('edit-max').value) || 0,
    minRating: parseInt(document.getElementById('edit-min-rating').value) || 0,
    maxRating: parseInt(document.getElementById('edit-max-rating').value) || 9999,
    blacklist: editBlacklist,
  };

  if (!payload.name) { toast(CH_I18N.t('tournaments.detail.admin_actions.name_required'), 'error'); btn.disabled = false; btn.textContent = CH_I18N.t('tournaments.detail.edit_modal.save_btn'); return; }
  if (!payload.startsAt) { toast(CH_I18N.t('tournaments.error.pick_start_date'), 'error'); btn.disabled = false; btn.textContent = CH_I18N.t('tournaments.detail.edit_modal.save_btn'); return; }

  try {
    // Некоторые хостинги/прокси режут метод PATCH — шлём POST на /edit,
    // для которого на сервере есть специальный дублёр-обработчик.
    const res = await fetch(API + '/tournaments/' + tId + '/edit', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await safeJson(res);
    if (!res.ok) throw new Error(data.error || CH_I18N.t('tournaments.detail.admin_actions.update_error'));
    toast(CH_I18N.t('tournaments.detail.admin_actions.updated_success'), 'success');
    closeEditModal();
    await loadTournament(); // перезагружаем данные
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = CH_I18N.t('tournaments.detail.edit_modal.save_btn');
  }
}

async function adminBanFromTournament(username) {
  if (!confirm(CH_I18N.t('tournaments.detail.admin_actions.ban_confirm', { username }))) return;
  try {
    const r = await fetch(API + '/tournaments/' + tId + '/anticheat-ban', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await safeJson(r);
    if (!r.ok) throw new Error(data.error || CH_I18N.t('tournaments.error.generic'));
    toast(CH_I18N.t('tournaments.detail.admin_actions.banned_success', { username }), 'success');
  } catch (e) { toast(e.message, 'error'); }
}

// ── WINNER ──
function showWinner(username) {
  document.getElementById('winner-name-display').textContent = username;
  document.getElementById('winner-overlay').classList.add('show');
}

// ── UTILS ──

document.getElementById('edit-modal')?.addEventListener('click', function(e) {
  if (e.target === this) closeEditModal();
});

document.addEventListener('ch-lang-changed', () => { if (tData) render(); });

init();
</script>
