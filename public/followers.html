<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/js/utils.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подписчики — Chess Home</title>
  <script src="/js/header.js"></script>
  <link rel="icon" href="/img/logo/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary, #0e0f13);
      color: var(--text-primary, #e8e9f0);
      font-family: 'Nunito', sans-serif;
    }
    .users-list {
      max-width: 600px;
      margin: 80px auto 40px;
      background: var(--bg-secondary, #161820);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border, #2e3040);
    }
    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin-bottom: 20px;
      color: var(--accent, #c9a84c);
    }
    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--border, #2e3040);
      cursor: pointer;
      transition: background 0.15s;
    }
    .user-item:hover {
      background: var(--bg-hover, rgba(255,255,255,0.05));
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent, #c9a84c), var(--accent-dark, #a07830));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #000;
      flex-shrink: 0;
    }
    .user-info {
      flex: 1;
    }
    .user-name {
      font-weight: 700;
      font-size: 15px;
    }
    .user-rating {
      font-size: 12px;
      color: var(--text-muted, #5a5e78);
      margin-top: 2px;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      display: inline-block;
      margin-left: 8px;
      vertical-align: middle;
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted, #5a5e78);
      padding: 40px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div id="ch-root"></div>

<div class="users-list">
  <h2 id="page-title">Загрузка...</h2>
  <div id="list-container"></div>
</div>

<script>
  const API = '/api';
  // Авторизация теперь через HttpOnly-cookie (ch_token), а не localStorage —
  // куки отправляются автоматически при credentials: 'include'.

  function esc(s) { return escapeHtml(s); }

  async function apiGet(path) {
    const res = await fetch(API + path, {
      credentials: 'include'
    });
    if (!res.ok) throw new Error((await res.json()).error || 'Ошибка');
    return res.json();
  }

  async function load() {
    const path = location.pathname;
    const isFollowers = path.includes('/followers/');
    const username = decodeURIComponent(path.split('/').pop());
    document.getElementById('page-title').textContent = isFollowers 
      ? `Подписчики ${esc(username)}` 
      : `Подписки ${esc(username)}`;
    
    try {
      const endpoint = isFollowers ? 'followers' : 'following';
      const data = await apiGet(`/follow/${endpoint}/${encodeURIComponent(username)}`);
      const container = document.getElementById('list-container');
      
      if (!data.length) {
        container.innerHTML = '<div class="empty-state">😔 Нет пользователей</div>';
        return;
      }
      
      container.innerHTML = data.map(u => `
        <div class="user-item" onclick="window.location='/profile/${encodeURIComponent(u.username)}'">
          <div class="user-avatar">${esc(u.username[0].toUpperCase())}</div>
          <div class="user-info">
            <div class="user-name">
              ${esc(u.username)} 
              ${u.online ? '<span class="online-dot"></span>' : ''}
            </div>
            <div class="user-rating">Рейтинг: ${u.rating || '—'}</div>
          </div>
        </div>
      `).join('');
    } catch (e) {
      document.getElementById('list-container').innerHTML = `<div class="empty-state">⚠️ Ошибка: ${e.message}</div>`;
    }
  }

  // Инициализация хедера
  if (window.CH) {
    CH.initHeader({ activePage: 'profile' });
    CH.setActivePage('profile');
  }
  load();
</script>
</body>
</html>
