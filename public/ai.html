<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessHome AI</title>
<link rel="icon" href="/img/logo/favicon.png">
<style>
  /* ── ChessHome AI — минималистичная чёрно-бирюзовая тема ───────── */
  :root {
    --bg: #060809;
    --bg-elev: #0b0f10;
    --border: rgba(255,255,255,0.07);
    --border-soft: rgba(255,255,255,0.04);
    --teal: #2dd4bf;
    --teal-bright: #6ee7d8;
    --teal-dim: #0f766e;
    --text-primary: #eef4f3;
    --text-secondary: #93a6a3;
    --text-muted: #576260;
    --user-bubble: rgba(45,212,191,0.10);
    --ai-bubble: rgba(255,255,255,0.035);
    --green: #34d399;
    --red: #ef6161;
    --radius: 20px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* Мягкое переливающееся бирюзовое свечение на чёрном фоне */
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font);
    min-height: 100vh;
    padding-top: 56px; /* место под фиксированный хедер сайта (#ch-header) */
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 15%, rgba(45,212,191,0.20) 0%, transparent 42%),
      radial-gradient(circle at 82% 8%, rgba(34,211,238,0.14) 0%, transparent 38%),
      radial-gradient(circle at 50% 95%, rgba(52,211,153,0.13) 0%, transparent 45%);
    background-size: 140% 140%;
    animation: shimmer 16s ease-in-out infinite alternate, hue-shift 22s linear infinite;
    filter: blur(30px);
  }
  @keyframes shimmer {
    0%   { background-position: 0% 0%, 100% 0%, 50% 100%; opacity: 0.75; }
    50%  { background-position: 15% 10%, 85% 15%, 45% 90%; opacity: 1; }
    100% { background-position: 5% 20%, 95% 5%, 55% 95%; opacity: 0.85; }
  }
  @keyframes hue-shift {
    0%   { filter: blur(30px) hue-rotate(0deg); }
    50%  { filter: blur(30px) hue-rotate(45deg); }
    100% { filter: blur(30px) hue-rotate(0deg); }
  }

  .page-wrap {
    width: 100%;
    max-width: 620px;
    padding: 44px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .header-block { text-align: center; margin-bottom: 30px; }
  .header-block .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 12px;
    letter-spacing: 0.3px;
    margin-bottom: 18px;
  }
  .header-block .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 10px var(--teal);
    animation: pulse-dot 2.2s infinite;
  }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .header-block h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.6px;
  }
  .header-block h1 .piece { display: none; } /* минимализм — убираем декоративную фигуру из заголовка */
  /* Переливающийся логотип — конический градиент с плавной сменой оттенков */
  .logo-mark {
    width: 52px; height: 52px;
    border-radius: 16px;
    margin: 0 auto 18px;
    position: relative;
    background: conic-gradient(from 0deg, #2dd4bf, #22d3ee, #34d399, #6ee7d8, #2dd4bf);
    animation: logo-hue 9s ease-in-out infinite, logo-float 4s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(45,212,191,0.45), 0 0 60px rgba(34,211,238,0.2);
  }
  .logo-mark::after {
    content: '';
    position: absolute; inset: 2px;
    border-radius: 14px;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 55%), var(--bg-elev);
    opacity: 0.14;
  }
  @keyframes logo-hue { 0%,100% { filter: hue-rotate(0deg) saturate(1.15); } 50% { filter: hue-rotate(50deg) saturate(1.35); } }
  @keyframes logo-float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  .header-block h1 span.hl {
    background: linear-gradient(135deg, var(--teal-bright), var(--teal-dim));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header-block p { margin: 10px 0 0; color: var(--text-muted); font-size: 14px; font-weight: 400; }

  /* ── Карточка чата: плоская, почти без теней, тонкая обводка ── */
  .chat-shell {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 30px 90px rgba(0,0,0,0.5);
  }

  .chat-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-soft);
  }
  .chat-topbar .who { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
  /* Тот же переливающийся значок, что и большое лого — только маленький */
  .chat-topbar .who .ava {
    width: 24px; height: 24px; border-radius: 8px;
    background: conic-gradient(from 0deg, #2dd4bf, #22d3ee, #34d399, #6ee7d8, #2dd4bf);
    box-shadow: 0 0 14px rgba(45,212,191,0.5);
    animation: logo-hue 9s ease-in-out infinite, breathe 2.6s ease-in-out infinite;
    font-size: 0; /* прячем эмодзи-иконку из разметки, оставляем только орб */
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.1); }
  }
  .chat-topbar .status { font-size: 11px; color: var(--text-muted); font-weight: 400; letter-spacing: 0.3px; }
  .chat-topbar .clear-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 12px; font-size: 12px; font-family: var(--font); cursor: pointer;
    border-radius: 999px;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .chat-topbar .clear-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .chat-topbar .clear-btn:hover { color: var(--red); border-color: rgba(239,97,97,0.4); background: rgba(239,97,97,0.06); }

  .chat-log {
    padding: 22px 20px 8px;
    height: 430px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-log::-webkit-scrollbar { width: 4px; }
  .chat-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Минимализм: убираем аватарки у каждой реплики, оставляем только пузыри */
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai { justify-content: flex-start; }
  .msg-row .avatar { display: none; }
  .msg-col { display: flex; flex-direction: column; gap: 8px; max-width: 78%; }
  .msg-row.user .msg-col { align-items: flex-end; }
  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    animation: pop-in 0.25s ease;
  }
  .msg-row.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border-soft);
    color: var(--text-primary);
    border-bottom-left-radius: 6px;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(45,212,191,0.18);
    color: var(--text-primary);
    border-bottom-right-radius: 6px;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    color: var(--teal-bright);
    font-weight: 600;
    font-size: 13px;
    padding: 7px 0;
    border-radius: 0;
    text-decoration: none;
    border: none;
    border-bottom: 1px solid rgba(110,231,216,0.35);
    cursor: pointer;
    transition: opacity 0.12s, border-color 0.12s;
    font-family: var(--font);
    width: fit-content;
  }
  .msg-action:hover { opacity: 0.8; border-color: var(--teal-bright); }
  .msg-action:active { opacity: 0.6; }

  /* Индикатор «думает» — дышащий орб вместо трёх точек */
  .typing-dots {
    display: flex; align-items: center; gap: 5px; padding: 6px 2px;
  }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--teal);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border-soft);
  }
  .suggestion-chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
    font-family: var(--font);
  }
  .suggestion-chip:hover { border-color: var(--teal); color: var(--text-primary); }
  .suggestion-chip:active { opacity: 0.7; }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 16px 18px;
    border-top: 1px solid var(--border-soft);
  }
  .input-bar input {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 18px;
    color: var(--text-primary);
    font-size: 14.5px;
    outline: none;
    font-family: var(--font);
    transition: border-color 0.15s;
  }
  .input-bar input:focus { border-color: var(--teal); }
  .input-bar input:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-bar button {
    background: var(--teal);
    border: none;
    border-radius: 999px;
    padding: 0 22px;
    color: #04211d;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 0 rgba(45,212,191,0);
  }
  .input-bar button:hover { box-shadow: 0 0 18px rgba(45,212,191,0.4); }
  .input-bar button:active { opacity: 0.8; }
  .input-bar button:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

  /* ── Оверлей блокировки для неавторизованных ── */
  .auth-gate {
    position: absolute;
    inset: 0;
    background: rgba(6,8,9,0.9);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 30px;
    z-index: 5;
  }
  .auth-gate.show { display: flex; }
  .auth-gate .lock-icon {
    width: 46px; height: 46px; border-radius: 14px; margin-bottom: 14px;
    background: conic-gradient(from 0deg, #2dd4bf, #22d3ee, #34d399, #6ee7d8, #2dd4bf);
    animation: logo-hue 9s ease-in-out infinite;
    box-shadow: 0 0 26px rgba(45,212,191,0.5);
    font-size: 0;
  }
  .auth-gate h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .auth-gate p { margin: 0 0 20px; color: var(--text-muted); font-size: 13.5px; max-width: 300px; line-height: 1.5; }
  .auth-gate .btns { display: flex; gap: 10px; }
  .auth-gate .btn-login, .auth-gate .btn-register {
    border-radius: 999px; padding: 10px 22px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; border: none; font-family: var(--font); transition: opacity 0.15s;
  }
  .auth-gate .btn-login { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
  .auth-gate .btn-login:hover { border-color: var(--teal); }
  .auth-gate .btn-register { background: var(--teal); color: #04211d; }
  .auth-gate .btn-register:hover { opacity: 0.88; }

  .footnote {
    max-width: 620px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 20px;
    line-height: 1.7;
    padding: 0 16px;
    position: relative;
    z-index: 1;
  }
  .footnote a { color: var(--teal); text-decoration: none; }
  .footnote a:hover { color: var(--teal-bright); }

  /* ── Компактная модалка входа/регистрации ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(3,4,5,0.75);
    display: none; align-items: center; justify-content: center; z-index: 2000;
    padding: 16px; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .auth-modal {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 22px; width: 100%; max-width: 340px;
    padding: 28px 26px 24px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
  }
  .auth-modal h2 { margin: 0 0 4px; font-size: 19px; font-weight: 700; text-align: center; }
  .auth-modal .sub { text-align: center; color: var(--text-muted); font-size: 12.5px; margin-bottom: 20px; }
  .auth-modal input {
    width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 14px; color: var(--text-primary);
    font-size: 14px; margin-bottom: 10px; outline: none; font-family: var(--font);
    transition: border-color 0.15s;
  }
  .auth-modal input:focus { border-color: var(--teal); }
  .auth-modal .hp-field { position: absolute; left: -9999px; opacity: 0; }
  .auth-modal .am-check {
    display: flex; align-items: flex-start; gap: 9px;
    font-size: 12.5px; color: var(--text-secondary); cursor: pointer;
    margin-bottom: 12px; line-height: 1.45; text-align: left;
  }
  .auth-modal .am-check input[type="checkbox"] {
    margin: 2px 0 0; flex-shrink: 0; width: 15px; height: 15px;
    accent-color: var(--teal); cursor: pointer;
  }
  .auth-modal .am-check a { color: var(--teal); text-decoration: none; }
  .auth-modal .am-check a:hover { color: var(--teal-bright); }
  .auth-modal .err { color: var(--red); font-size: 12px; min-height: 16px; margin-bottom: 8px; }
  .auth-modal .submit-btn {
    width: 100%; background: var(--teal);
    border: none; border-radius: 999px; padding: 12px; color: #04211d;
    font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px;
    transition: opacity 0.15s;
  }
  .auth-modal .submit-btn:hover { opacity: 0.88; }
  .auth-modal .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-modal .switch-mode {
    text-align: center; margin-top: 16px; font-size: 12.5px; color: var(--text-muted);
  }
  .auth-modal .switch-mode a { color: var(--teal); text-decoration: none; cursor: pointer; }
  .auth-modal .close-x {
    float: right; background: none; border: none; color: var(--text-muted);
    font-size: 17px; cursor: pointer; margin: -6px -4px 0 0;
  }
  .auth-modal .code-input {
    text-align: center; font-size: 22px; letter-spacing: 9px; padding: 12px; border-radius: 12px;
  }

  @media (max-width: 480px) {
    .chat-log { height: 380px; }
    .header-block h1 { font-size: 26px; }
    .msg-col { max-width: 88%; }
  }
</style>
</head>
<body>

  <div class="page-wrap">
    <div class="header-block">
      <div class="logo-mark"></div>
      <div class="badge"><span class="dot"></span> <span data-i18n="ai.page_badge">ChessHome AI online</span></div>
      <h1><span class="piece">♞</span>Chess<span class="hl">Home</span> AI</h1>
      <p data-i18n="ai.page_subtitle">Задай вопрос про сайт — отвечу, если знаю</p>
      <div class="analysis-link" style="margin-top:14px">
        <a href="/analysis" style="color:#4fd1c5;text-decoration:none;font-size:14px;font-weight:600">🔍 <span data-i18n="ai.page_try_analysis">Разобрать партию с Stockfish →</span></a>
      </div>
    </div>

    <div class="chat-shell">
      <div class="chat-topbar">
        <div class="who"><span class="ava">♞</span> ChessHome AI <span class="status" id="chat-status">BETA</span></div>
        <button class="clear-btn" id="clear-chat-btn" title="Очистить историю" data-i18n-title="ai.page_clear_title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
          <span data-i18n="ai.page_clear">Очистить</span>
        </button>
      </div>

      <div class="chat-log" id="chat-log"></div>
      <div class="suggestions" id="suggestions"></div>
      <div class="input-bar">
        <input type="text" id="chat-input" placeholder="Напиши что-нибудь..." autocomplete="off" disabled data-i18n-placeholder="ai.page_input_placeholder">
        <button id="send-btn" disabled data-i18n="ai.page_send">Отправить</button>
      </div>

      <div class="auth-gate" id="auth-gate">
        <div class="lock-icon">🔒</div>
        <h3 data-i18n="ai.page_gate_title">Только для зарегистрированных</h3>
        <p data-i18n="ai.page_gate_text">Войдите или зарегистрируйтесь, чтобы пообщаться с ChessHome AI — это займёт 10 секунд.</p>
        <div class="btns">
          <button class="btn-login" onclick="openAuthModal('login')" data-i18n="ai.page_gate_login">Войти</button>
          <button class="btn-register" onclick="openAuthModal('register')" data-i18n="ai.page_gate_register">Регистрация</button>
        </div>
      </div>
    </div>

    <div class="footnote">
      ChessHome AI BETA <br>
      <a href="/" data-i18n="ai.page_back">← Вернуться на ChessHome</a>
    </div>
  </div>

  <!-- Компактная модалка входа/регистрации/2FA -->
  <div class="modal-overlay" id="auth-modal-overlay">
    <div class="auth-modal" id="auth-modal-content"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/header.js"></script>
<script>
// ══════════════════════════════════════════════════════════════
//  ChessHome AI — имитация «умного» бота на заготовленных ответах.
//  Никакого реального ИИ тут нет: просто сопоставление ключевых
//  слов из вопроса со списком известных тем и случайный выбор
//  одного из нескольких готовых ответов на эту тему.
// ══════════════════════════════════════════════════════════════

const API = '/api';

// i18n-хелпер: словарь может быть ещё не загружен — тогда русский fallback
function T(key, fallback) {
  try {
    const v = window.CH_I18N ? window.CH_I18N.t(key) : undefined;
    if (v && v !== key) return v;
  } catch (e) { /* i18n недоступен */ }
  return fallback !== undefined ? fallback : key;
}

async function apiPost(path, body) {
  const res = await fetch(API + path, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || 'Ошибка');
  return data;
}
async function apiGet(path) {
  const res = await fetch(API + path, { credentials: 'same-origin' });
  if (!res.ok) return null;
  try { return await res.json(); } catch { return null; }
}

// ─── Нормализация текста (как и в фильтре чата на сайте) ───────
function normalizeText(text) {
  return text
    .toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/[^a-zа-я0-9\s]/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// ─── База «знаний»: ключевые слова → ответы (+ опционально кнопка) ─
// action.href — обычная ссылка; action.onClick — вызов JS-функции по имени.
const INTENTS = [

  'Хм, это не совсем по моей части — я тут больше отдыхаю и наблюдаю за партиями. Сыграй лучше партийку!',

const SUGGESTED_QUESTIONS = [
  'Привет!', 'Как зарегистрироваться?', 'Как считается рейтинг?',
  'Есть турниры?', 'Расскажи анекдот', 'Кто ты?', 'Что такое пат?', 'Как разобрать партию?',
];

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function findAnswer(userText) {
  const norm = normalizeText(userText);
  if (!norm) return { text: pickRandom(FALLBACK_ANSWERS) };
  for (const intent of INTENTS) {
    if (intent.keywords.some(kw => norm.includes(kw))) {
      return { text: pickRandom(intent.answers), action: intent.action || null };
    }
  }
  return { text: pickRandom(FALLBACK_ANSWERS) };
}

// ─── Состояние авторизации ──────────────────────────────────────
let currentUser = null;

// ─── История чата в localStorage (отдельно на каждого юзера) ────
function historyKey() {
  return currentUser ? `chesshome_ai_history_${currentUser.username.toLowerCase()}` : null;
}
function saveHistory(msgs) {
  const key = historyKey();
  if (!key) return;
  try { localStorage.setItem(key, JSON.stringify(msgs.slice(-100))); } catch {}
}
function loadHistory() {
  const key = historyKey();
  if (!key) return null;
  try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; }
}
let messages = []; // { who: 'user'|'ai', text, action }

// ─── Рендер чата ────────────────────────────────────────────────
const chatLog = document.getElementById('chat-log');
const inputEl = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const suggestionsEl = document.getElementById('suggestions');
const authGateEl = document.getElementById('auth-gate');

function scrollToBottom() { chatLog.scrollTop = chatLog.scrollHeight; }

function renderActionEl(action) {
  if (!action) return null;
  if (action.href) {
    const a = document.createElement('a');
    a.className = 'msg-action';
    a.href = action.href;
    a.textContent = action.label;
    if (/^https?:\/\//.test(action.href)) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }
  if (action.onClick) {
    const btn = document.createElement('button');
    btn.className = 'msg-action';
    btn.type = 'button';
    btn.textContent = action.label;
    btn.setAttribute('onclick', action.onClick);
    return btn;
  }
  return null;
}

function renderMessage(msg) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + msg.who;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = msg.who === 'ai' ? '♞' : '🙂';
  const col = document.createElement('div');
  col.className = 'msg-col';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = msg.text;
  col.appendChild(bubble);
  const actionEl = renderActionEl(msg.action);
  if (actionEl) col.appendChild(actionEl);
  row.appendChild(avatar);
  row.appendChild(col);
  chatLog.appendChild(row);
  scrollToBottom();
}

function renderAllMessages() {
  chatLog.innerHTML = '';
  messages.forEach(renderMessage);
}

function addTypingIndicator() {
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  row.innerHTML = '<div class="avatar">♞</div><div class="msg-col"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>';
  chatLog.appendChild(row);
  scrollToBottom();
  return row;
}

let busy = false;

function sendMessage(text) {
  if (!currentUser) { authGateEl.classList.add('show'); return; }
  const trimmed = text.trim();
  if (!trimmed || busy) return;
  busy = true;
  inputEl.value = '';

  const userMsg = { who: 'user', text: trimmed, action: null };
  messages.push(userMsg);
  renderMessage(userMsg);
  saveHistory(messages);

  const typingRow = addTypingIndicator();
  const delay = 600 + Math.random() * 1000;
  setTimeout(() => {
    typingRow.remove();
    const { text: answerText, action } = findAnswer(trimmed);
    const aiMsg = { who: 'ai', text: answerText, action };
    messages.push(aiMsg);
    renderMessage(aiMsg);
    saveHistory(messages);
    busy = false;
  }, delay);
}

sendBtn.addEventListener('click', () => sendMessage(inputEl.value));
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(inputEl.value); });

function renderSuggestions() {
  suggestionsEl.innerHTML = '';
  SUGGESTED_QUESTIONS.forEach(q => {
    const chip = document.createElement('button');
    chip.className = 'suggestion-chip';
    chip.type = 'button';
    chip.textContent = q;
    chip.addEventListener('click', () => sendMessage(q));
    suggestionsEl.appendChild(chip);
  });
}
renderSuggestions();

document.getElementById('clear-chat-btn').addEventListener('click', () => {
  if (!confirm(T('ai.page_confirm_clear', 'Очистить историю переписки?'))) return;
  messages = [];
  const greeting = { who: 'ai', text: T('ai.page_greeting', 'Привет! Я ChessHome AI 🤖♟️ Спроси меня о сайте, или жми на подсказки ниже.'), action: null };
  messages.push(greeting);
  renderAllMessages();
  saveHistory(messages);
});

// ─── Гейт авторизации ────────────────────────────────────────────
function unlockChat() {
  authGateEl.classList.remove('show');
  inputEl.disabled = false;
  sendBtn.disabled = false;
  const restored = loadHistory();
  if (restored && restored.length) {
    messages = restored;
  } else {
    messages = [{ who: 'ai', text: T('ai.page_greeting', 'Привет! Я ChessHome AI 🤖♟️ Спроси меня о сайте, или жми на подсказки ниже.'), action: null }];
  }
  renderAllMessages();
}
function lockChat() {
  authGateEl.classList.add('show');
  inputEl.disabled = true;
  sendBtn.disabled = true;
  messages = [{ who: 'ai', text: T('ai.page_greeting_locked', 'Привет! Я ChessHome AI 🤖♟️ Войди, чтобы пообщаться со мной по-настоящему.'), action: null }];
  renderAllMessages();
}
function onAuthStateResolved(user) {
  currentUser = user || null;
  if (currentUser) unlockChat(); else lockChat();
}

// Точная копия updateRegisterButtonState() с главной страницы — кнопка
// «Создать аккаунт» разблокируется, только когда отмечены оба чекбокса.
function updateAmRegisterButtonState() {
  const terms = document.getElementById('am-agree-terms');
  const fair = document.getElementById('am-agree-fair');
  const btn = document.getElementById('am-submit');
  if (!btn) return;
  const allChecked = !!(terms && terms.checked && fair && fair.checked);
  btn.disabled = !allChecked;
}
function closeAuthModal() {
  document.getElementById('auth-modal-overlay').classList.remove('open');
}

function renderAuthModal() {
  const el = document.getElementById('auth-modal-content');
  if (authMode === 'login') {
    el.innerHTML = `

      <h2>Вход</h2>
      <div class="sub">Рады снова тебя видеть</div>

      <div class="sub">10 секунд — и ты внутри</div>

        <span>Я согласен с <a href="/privacy" target="_blank">политикой конфиденциальности</a> и <a href="/terms" target="_blank">пользовательским соглашением</a> сайта</span>
      </label>
      <label class="am-check">
        <input type="checkbox" id="am-agree-fair" onchange="updateAmRegisterButtonState()">
        <span>Я не буду создавать несколько аккаунтов и читерить (использовать посторонние подсказки/движки во время партий)</span>
      </label>
      <div class="err" id="am-err"></div>
      <button class="submit-btn" id="am-submit" onclick="submitAuthForm()" disabled>Создать аккаунт</button>
      <div class="switch-mode">Уже есть аккаунт? <a onclick="openAuthModal('login')">Войти</a></div>
    `;
  } else if (authMode === '2fa') {
    el.innerHTML = `
      <button class="close-x" onclick="closeAuthModal()">✕</button>
      <h2>Код подтверждения</h2>
      <div class="sub">Мы отправили код вам на почту</div>

      <div class="err" id="am-err"></div>
      <button class="submit-btn" id="am-submit" onclick="submitAuthForm()">Подтвердить</button>
      <div class="switch-mode"><a onclick="openAuthModal('login')">← Назад ко входу</a></div>
    `;
    setTimeout(() => {
      const codeInp = document.getElementById('am-code');
      codeInp?.focus();
      codeInp?.addEventListener('input', () => {
        if (codeInp.value.replace(/\D/g, '').length === 6) submitAuthForm();
      });

}

async function submitAuthForm() {
  if (authBusy) return;
  const errEl = document.getElementById('am-err');
  const btn = document.getElementById('am-submit');
  errEl.textContent = '';
  authBusy = true;
  btn.disabled = true;

  try {
    if (authMode === 'login') {
      const username = document.getElementById('am-username').value.trim();
      const password = document.getElementById('am-password').value;
      if (!username || !password) throw new Error('Заполните все поля');
      const data = await apiPost('/login', { username, password });
      if (data.twoFactorRequired) { authMode = '2fa'; renderAuthModal(); authBusy = false; btn.disabled = false; return; }
      finishAuth(data.user);
    } else if (authMode === 'register') {
      const username = document.getElementById('am-username').value.trim();
      const password = document.getElementById('am-password').value;
      const _hp = document.getElementById('am-hp').value || '';
      const agreeTerms = document.getElementById('am-agree-terms')?.checked;
      const agreeFair = document.getElementById('am-agree-fair')?.checked;
      if (!username || !password) throw new Error('Заполните все поля');
      if (!agreeTerms || !agreeFair) throw new Error('Отметьте оба чекбокса ниже');
      const data = await apiPost('/register', { username, password, _hp });
      finishAuth(data.user);
    } else if (authMode === '2fa') {
      const code = document.getElementById('am-code').value.replace(/\D/g, '');
      if (code.length !== 6) throw new Error('Введите 6-значный код');
      const data = await apiPost('/login/verify-2fa', { code });
      finishAuth(data.user);
    }
  } catch (err) {
    errEl.textContent = err.message || 'Ошибка';
  } finally {
    authBusy = false;
    if (btn) btn.disabled = false;
  }
}

function finishAuth(user) {
  closeAuthModal();
  if (window.CH) CH.setCurrentUser(user);
  else onAuthStateResolved(user);
}

// ─── Инициализация: подключаем шапку сайта (header.js) и проверяем логин ──
document.addEventListener('DOMContentLoaded', () => {
  if (window.CH) {
    const origSetCurrentUser = CH.setCurrentUser.bind(CH);
    CH.setCurrentUser = function (user) {
      origSetCurrentUser(user);
      onAuthStateResolved(user);
    };
    CH.openAuthModal = (mode) => openAuthModal(mode); // подменяем на нашу модалку
    CH.initHeader({ activePage: 'ai' });
    // На случай если сессии нет — CH.initHeader сам вызовет setCurrentUser(null)
    // не всегда явно, подстрахуемся собственным запросом.
    setTimeout(() => { if (currentUser === null) apiGet('/me').then(u => onAuthStateResolved(u)); }, 400);
  } else {
    apiGet('/me').then(u => onAuthStateResolved(u));
  }
});

// Смена языка: переводим статичный каркас (data-i18n) и перерисовываем чат
// с приветствием на новом языке (история остаётся нетронутой).
document.addEventListener('ch-lang-changed', () => {
  if (typeof currentUser !== 'undefined') onAuthStateResolved(currentUser);
});
</script>
</body>
