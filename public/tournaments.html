<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/js/utils.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="tournaments.page_title">Турниры — Chess Home</title>
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/header.js"></script>
<link rel="icon" type="image/png" href="/img/logo/favicon.png">
  <style>
    body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); }

    /* ── PAGE LAYOUT ── */
    .tournaments-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 20px 40px;
    }

    /* ── HEADER HERO ── */
    .page-hero {
      text-align: center;
      padding: 40px 0 32px;
      position: relative;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 400px; height: 200px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .page-hero-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      border-radius: 16px;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.28);
      font-size: 28px;
      margin-bottom: 14px;
    }
    .page-hero h1 {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .page-hero h1 span { color: var(--accent); }
    .page-hero p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    /* ── TABS ── */
    .tabs-bar {
      display: flex;
      flex-wrap: wrap;          /* issue #22: не выпадать за экран на мобильных */
      max-width: 100%;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      width: fit-content;
    }
    .tab-btn {
      padding: 8px 22px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 3px 14px rgba(201,168,76,0.35);
    }
    .tab-btn:hover:not(.active) {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .tab-count {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .tab-btn.active .tab-count {
      background: rgba(0,0,0,0.2);
    }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ── ADMIN CREATE BUTTON ── */
    .btn-create {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(201,168,76,0.3);
      text-decoration: none;
    }
    .btn-create:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(201,168,76,0.45);
    }

    /* ── TOURNAMENT CARDS ── */
    .tournaments-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .t-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .t-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 4px 0 0 4px;
    }
    .t-card.status-active::before { background: var(--green); }
    .t-card.status-upcoming::before { background: var(--accent); }
    .t-card.status-finished::before { background: var(--text-muted); }

    .t-card:hover {
      border-color: var(--border-light);
      background: var(--bg-hover);
      transform: translateX(3px);
    }

    .t-card-icon {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .t-card.status-active .t-card-icon { background: rgba(76,175,114,0.15); }
    .t-card.status-upcoming .t-card-icon { background: rgba(201,168,76,0.12); }
    .t-card.status-finished .t-card-icon { background: rgba(90,94,120,0.2); }

    .t-card-main { flex: 1; min-width: 0; }

    .t-card-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .t-card-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .t-meta-item {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .t-user-badge {
      color: var(--accent);
      cursor: help;
    }

    .t-card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-badge.active {
      background: rgba(76,175,114,0.15);
      color: var(--green);
      border: 1px solid rgba(76,175,114,0.3);
    }
    .status-badge.upcoming {
      background: rgba(201,168,76,0.12);
      color: var(--accent);
      border: 1px solid rgba(201,168,76,0.3);
    }
    .status-badge.finished {
      background: rgba(90,94,120,0.15);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .status-badge .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
    .status-badge.active .dot {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 1.5s infinite;
    }
    .status-badge.upcoming .dot { background: var(--accent); }
    .status-badge.finished .dot { background: var(--text-muted); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .t-participants {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .t-time-control {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }

    /* ── LOADING ── */
    .loading-shimmer {
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 14px;
      height: 90px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── MODAL: CREATE TOURNAMENT ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.08);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.25s;
    }
    .modal-overlay.open .modal-box {
      transform: scale(1) translateY(0);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .modal-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* ── FORM ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .form-group.full { grid-column: 1 / -1; }
    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input, .form-select, .form-textarea {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      padding: 10px 14px;
      transition: border-color 0.2s;
      width: 100%;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-select { cursor: pointer; }
    .form-select option { background: var(--bg-card); }

    .form-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Club-only tournament block */
    .club-only-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .club-only-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .club-only-toggle input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .club-only-box .form-select:disabled { opacity: 0.5; cursor: not-allowed; }

    .t-club-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(93,173,226,0.12); border: 1px solid rgba(93,173,226,0.3);
      color: #5dade2; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 6px;
    }

    /* Blacklist */
    .blacklist-input-row {
      display: flex;
      gap: 8px;
    }
    .blacklist-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .bl-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(224,85,85,0.12);
      border: 1px solid rgba(224,85,85,0.3);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--red);
      font-weight: 600;
    }
    .bl-tag-remove {
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      opacity: 0.7;
    }
    .bl-tag-remove:hover { opacity: 1; }

    .btn-add-bl {
      padding: 8px 14px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-add-bl:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .btn-cancel {
      padding: 10px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel:hover {
      border-color: var(--border-light);
      color: var(--text-primary);
    }
    .btn-submit {
      padding: 10px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      border-radius: 9px;
      color: #000;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(201,168,76,0.3);
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(201,168,76,0.45);
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── TOAST ── */
    #toast-container {
      position: fixed;
      bottom: 28px; right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: slideInRight 0.3s ease;
      pointer-events: all;
    }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red); }
    @keyframes slideInRight {
      from { transform: translateX(40px); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }

    /* ── WINNER BADGE ── */
    .winner-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .t-card { flex-wrap: wrap; gap: 12px; }
      .t-card-right { flex-direction: row; align-items: center; }
      .page-hero h1 { font-size: 28px; }
      /* issue #22: табы «Идут сейчас / Предстоят / Завершены» не влезают в 360px */
      .tab-btn { padding: 8px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
<!-- header injected by /js/header.js -->

  <div class="tournaments-page" style="padding-top:56px">
    <!-- HERO -->
    <div class="page-hero">
      <div class="page-hero-badge">🏆</div>
      <h1 data-i18n-html="tournaments.hero_title">Арена <span>Турниры</span></h1>
      <p data-i18n="tournaments.hero_subtitle">Рейтинговые шахматные арены — поиск соперников в реальном времени</p>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
      <!-- TABS -->
      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="active" onclick="switchTab('active')">
          <span>🟢</span> <span data-i18n="tournaments.tab_active">Идут сейчас</span> <span class="tab-count" id="cnt-active">0</span>
        </button>
        <button class="tab-btn" data-tab="upcoming" onclick="switchTab('upcoming')">
          <span>🕐</span> <span data-i18n="tournaments.tab_upcoming">Предстоят</span> <span class="tab-count" id="cnt-upcoming">0</span>
        </button>
        <button class="tab-btn" data-tab="finished" onclick="switchTab('finished')">
          <span>🏁</span> <span data-i18n="tournaments.tab_finished">Завершены</span> <span class="tab-count" id="cnt-finished">0</span>
        </button>
      </div>

      <!-- ADMIN: CREATE -->
      <button class="btn-create" id="btn-create-tournament" style="display:none" onclick="openCreateModal()" data-i18n="tournaments.create_btn">
        ✚ Создать турнир
      </button>
    </div>

    <!-- LIST -->
    <div class="tournaments-grid" id="tournaments-list">
      <div class="loading-shimmer"></div>
      <div class="loading-shimmer"></div>
      <div class="loading-shimmer"></div>
    </div>

    <!-- TOP-10 POPULAR -->
    <div id="popular-section" style="margin-top:40px;padding-top:32px;border-top:1px solid var(--border);display:none">
      <h2 style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-primary);margin-bottom:16px;display:flex;align-items:center;gap:8px" data-i18n="tournaments.popular_title">🔥 Самые популярные арены</h2>
      <div class="tournaments-grid" id="popular-list"></div>
    </div>
  </div>

  <!-- MODAL: CREATE TOURNAMENT -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" data-i18n="tournaments.modal_title">🏆 Новый турнир</div>
        <button class="modal-close" onclick="closeCreateModal()">✕</button>
      </div>

      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label" data-i18n="tournaments.name_label">Название турнира *</label>
          <input type="text" class="form-input" id="t-name" maxlength="60" placeholder="Воскресная арена · Блиц · и т.д." data-i18n-placeholder="tournaments.name_placeholder">
        </div>

        <div class="form-group full">
          <label class="form-label" data-i18n="tournaments.description_label">Описание</label>
          <textarea class="form-textarea" id="t-desc" maxlength="1000" placeholder="Краткое описание турнира..." data-i18n-placeholder="tournaments.description_placeholder"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="tournaments.time_control_label">Контроль времени *</label>
          <select class="form-select" id="t-tc">
            <option value="15s+0" data-i18n="tournaments.tc.bullet_15s">15 сек (Пуля)</option>
            <option value="1+0" data-i18n="tournaments.tc.bullet_1_0">1+0 (Пуля)</option>
            <option value="1+1" data-i18n="tournaments.tc.bullet_1_1">1+1 (Пуля)</option>
            <option value="2+1" data-i18n="tournaments.tc.bullet_2_1">2+1 (Пуля)</option>
            <option value="3+0" data-i18n="tournaments.tc.blitz_3_0">3+0 (Блиц)</option>
            <option value="3+2" selected data-i18n="tournaments.tc.blitz_3_2">3+2 (Блиц)</option>
            <option value="5+0" data-i18n="tournaments.tc.blitz_5_0">5+0 (Блиц)</option>
            <option value="5+3" data-i18n="tournaments.tc.blitz_5_3">5+3 (Блиц)</option>
            <option value="10+0" data-i18n="tournaments.tc.rapid_10_0">10+0 (Рапид)</option>
            <option value="10+5" data-i18n="tournaments.tc.rapid_10_5">10+5 (Рапид)</option>
            <option value="15+10" data-i18n="tournaments.tc.rapid_15_10">15+10 (Рапид)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="tournaments.duration_label">Длительность *</label>
          <select class="form-select" id="t-duration">
            <option value="20" data-i18n="tournaments.duration_options.d20">20 минут</option>
            <option value="30" selected data-i18n="tournaments.duration_options.d30">30 минут</option>
            <option value="45" data-i18n="tournaments.duration_options.d45">45 минут</option>
            <option value="60" data-i18n="tournaments.duration_options.d60">1 час</option>
            <option value="90" data-i18n="tournaments.duration_options.d90">1.5 часа</option>
            <option value="120" data-i18n="tournaments.duration_options.d120">2 часа</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="tournaments.starts_at_label">Дата и время начала *</label>
          <input type="datetime-local" class="form-input" id="t-starts-at">
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="tournaments.max_participants_label">Макс. участников</label>
          <input type="number" class="form-input" id="t-max" min="0" max="500" placeholder="0 = без лимита" data-i18n-placeholder="tournaments.no_limit_placeholder">
          <span class="form-hint" data-i18n="tournaments.max_participants_hint">0 — без ограничений</span>
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="tournaments.min_rating_label">Мин. рейтинг</label>
          <input type="number" class="form-input" id="t-min-rating" min="0" max="3000" placeholder="0 = без лимита" data-i18n-placeholder="tournaments.no_limit_placeholder">
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="tournaments.max_rating_label">Макс. рейтинг</label>
          <input type="number" class="form-input" id="t-max-rating" min="0" max="3000" placeholder="0 = без лимита" data-i18n-placeholder="tournaments.no_limit_placeholder">
        </div>

        <div class="form-group full" id="club-only-group" style="display:none">
          <label class="form-label" data-i18n="tournaments.club_section_label">🛡️ Клубный турнир</label>
          <div class="club-only-box">
            <select class="form-select" id="t-club-select" onchange="onClubSelectChange()">
              <option value="" data-i18n="tournaments.club_select_default">— Обычный турнир (без привязки к клубу) —</option>
            </select>
            <label class="club-only-toggle" id="club-only-toggle-row" style="display:none">
              <input type="checkbox" id="t-club-only" checked>
              <span data-i18n="tournaments.club_only_toggle_label">Только для участников выбранного клуба</span>
            </label>
            <span class="form-hint" data-i18n="tournaments.club_only_hint">Доступно только администраторам клуба. Если галочка снята — турнир будет виден в клубе, но участвовать сможет любой.</span>
          </div>
        </div>

        <div class="form-group full">
          <label class="form-label" data-i18n="tournaments.blacklist_label">⛔ Blacklist — кому закрыт вход</label>
          <div class="blacklist-input-row">
            <input type="text" class="form-input" id="t-bl-input" placeholder="Ник игрока..." onkeydown="if(event.key==='Enter')addToBlacklist()" data-i18n-placeholder="tournaments.blacklist_placeholder">
            <button class="btn-add-bl" onclick="addToBlacklist()" data-i18n="tournaments.blacklist_add_btn">Добавить</button>
          </div>
          <div class="blacklist-tags" id="bl-tags"></div>
          <span class="form-hint" data-i18n="tournaments.blacklist_hint">Эти игроки не смогут войти в турнир</span>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeCreateModal()" data-i18n="tournaments.cancel_btn">Отмена</button>
        <button class="btn-submit" id="btn-create-submit" onclick="submitCreateTournament()" data-i18n="tournaments.submit_btn">🏆 Создать турнир</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast-container"></div>

  <script>
    const API = '/api';
    // Некоторые хостинги/прокси при ошибке (например, превышен лимит тела
    // запроса) возвращают HTML-страницу вместо JSON — это и вызывало
    // "JSON.parse: unexpected character at line 1 column 1".
    async function safeJson(res) {
      try {
        return await res.json();
      } catch (e) {
        throw new Error(CH_I18N.t('tournaments.error.bad_response') + (res.status ? ` (${res.status})` : '') + '. ' + CH_I18N.t('tournaments.error.try_again'));
      }
    }
    // Токен живёт только в HttpOnly-cookie ch_token — браузер шлёт её сам,
    // читать/хранить в localStorage больше нечего (и нельзя).
    let currentUser = null;
    let allTournaments = { active: [], upcoming: [], finished: [] };

    // ── ВКЛАДКА ПО URL ──
    // /tournaments        → active
    // /tournaments/active
    // /tournaments/upcoming
    // /tournaments/finished  (алиасы: ended, past — на случай, если кто-то так свяжет)
    const TAB_ALIASES = { active: 'active', upcoming: 'upcoming', finished: 'finished', ended: 'finished', past: 'finished' };
    function pathToTab(path) {
      const seg = (path.replace(/^\/tournaments\/?/, '').split('/')[0] || '').toLowerCase();
      return TAB_ALIASES[seg] || 'active';
    }
    function tabToPath(tab) {
      return tab === 'active' ? '/tournaments' : '/tournaments/' + tab;
    }

    let currentTab = pathToTab(location.pathname);
    let blacklist = [];
    let myAdminClubs = []; // клубы, где текущий пользователь — администратор (может создавать клубные турниры)

    window.addEventListener('popstate', () => {
      currentTab = pathToTab(location.pathname);
      syncTabButtons();
      renderList();
    });

    function syncTabButtons() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
    }

    // ── AUTH ──
    // 4.1: делегат к каноничной escapeHtml (utils.js) — её набор символов
    // надмножество старого escHtmlAttr (& < > " + ')
    function escHtmlAttr(s) { return escapeHtml(s); }

    function logout() {
      fetch(API + '/logout', { method: 'POST', credentials: 'same-origin' }).finally(() => location.href = '/');
    }

    async function init() {
      CH.initHeader();
      // Куку ch_token браузер отправит сам — просто спрашиваем сервер, кто мы.

      try {
        const r = await fetch(API + '/me', { credentials: 'same-origin' });
        if (r.ok) {
          currentUser = await r.json();
          CH.setCurrentUser(currentUser);
        }
      } catch {}
      CH.setActivePage('tournaments');
      syncTabButtons();
      if (currentUser) {
        document.getElementById('btn-create-tournament').style.display = 'flex';
        await loadMyAdminClubs();
      }
      // Set default datetime
      const dt = document.getElementById('t-starts-at');
      if (dt) {
        const now = new Date(Date.now() + 60 * 60 * 1000);
        dt.value = now.toISOString().slice(0, 16);
      }
      await loadTournaments();
      setInterval(loadTournaments, 15000);

      // Пришли со страницы клуба через «Создать клубный турнир» — открываем
      // модалку сразу с предвыбранным клубом и включённым ограничением.
      const params = new URLSearchParams(location.search);
      const clubParam = params.get('createClubTournament');
      if (clubParam && currentUser) {
        openCreateModal();
        const sel = document.getElementById('t-club-select');
        if (sel && [...sel.options].some(o => o.value === clubParam)) {
          sel.value = clubParam;
          onClubSelectChange();
          document.getElementById('t-club-only').checked = true;
        }
      }
    }

    // ── КЛУБЫ, ГДЕ Я АДМИНИСТРАТОР ──
    function isClubAdminOf(club) {
      if (!currentUser) return false;
      const lname = currentUser.username.toLowerCase();
      if (currentUser.role === 'admin') return true;
      if ((club.createdBy || '').toLowerCase() === lname) return true;
      return (club.admins || []).map(a => a.toLowerCase()).includes(lname);
    }
    async function loadMyAdminClubs() {
      try {
        const clubs = await fetch(API + '/clubs', { credentials: 'same-origin' }).then(r => r.json());
        myAdminClubs = (clubs || []).filter(isClubAdminOf);
      } catch { myAdminClubs = []; }
      const group = document.getElementById('club-only-group');
      const sel = document.getElementById('t-club-select');
      if (!myAdminClubs.length) { group.style.display = 'none'; return; }
      group.style.display = '';
      sel.innerHTML = `<option value="">${CH_I18N.t('tournaments.club_select_default')}</option>` +
        myAdminClubs.map(c => `<option value="${escHtmlAttr(c.id)}">🛡️ ${escHtmlAttr(c.name)}</option>`).join('');
    }
    function onClubSelectChange() {
      const sel = document.getElementById('t-club-select');
      const row = document.getElementById('club-only-toggle-row');
      row.style.display = sel.value ? 'flex' : 'none';
    }

    // ── LOAD ──
    async function loadTournaments() {
      try {
        const [data, popular] = await Promise.all([
          fetch(API + '/tournaments').then(r => r.json()),
          fetch(API + '/tournaments/popular').then(r => r.json()).catch(() => []),
        ]);
        allTournaments = { active: [], upcoming: [], finished: [] };
        const oneYearAgo = Date.now() - 365 * 24 * 60 * 60 * 1000;
        for (const t of data) {
          if (t.status === 'finished' && t.endsAt < oneYearAgo) continue; // старше года — не показываем
          if (t.status === 'active')   allTournaments.active.push(t);
          else if (t.status === 'upcoming') allTournaments.upcoming.push(t);
          else if (t.status === 'finished') allTournaments.finished.push(t);
        }
        document.getElementById('cnt-active').textContent   = allTournaments.active.length;
        document.getElementById('cnt-upcoming').textContent = allTournaments.upcoming.length;
        document.getElementById('cnt-finished').textContent = allTournaments.finished.length;
        renderList();

        // Топ популярных
        const popSection = document.getElementById('popular-section');
        const popList = document.getElementById('popular-list');
        if (popular && popular.length > 0) {
          popList.innerHTML = popular.map(t => renderCard(t)).join('');
          popSection.style.display = '';
        } else {
          popSection.style.display = 'none';
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ── TABS ──
    function switchTab(tab) {
      if (tab === currentTab) return;
      currentTab = tab;
      syncTabButtons();
      renderList();
      history.pushState({ tab }, '', tabToPath(tab));
    }

    // ── RENDER ──
    function renderList() {
      const list = allTournaments[currentTab] || [];
      const el = document.getElementById('tournaments-list');

      if (!list.length) {
        const msgs = {
          active:   ['🎯', CH_I18N.t('tournaments.empty.active.title'), CH_I18N.t('tournaments.empty.active.sub')],
          upcoming: ['🕐', CH_I18N.t('tournaments.empty.upcoming.title'), CH_I18N.t('tournaments.empty.upcoming.sub')],
          finished: ['🏁', CH_I18N.t('tournaments.empty.finished.title'), CH_I18N.t('tournaments.empty.finished.sub')],
        };
        const [icon, title, sub] = msgs[currentTab];
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${icon}</div>
            <h3>${title}</h3>
            <p>${sub}</p>
          </div>`;
        return;
      }

      // Sort: active по endsAt, upcoming по startsAt, finished по endsAt desc
      const sorted = [...list].sort((a, b) => {
        if (currentTab === 'finished') return b.endsAt - a.endsAt;
        return a.startsAt - b.startsAt;
      });

      el.innerHTML = sorted.map(t => renderCard(t)).join('');
    }

    function renderCard(t) {
      const statusLabels = { active: CH_I18N.t('tournaments.status.active'), upcoming: CH_I18N.t('tournaments.status.upcoming'), finished: CH_I18N.t('tournaments.status.finished') };
      const statusIcons  = { active: '🟢', upcoming: '🕐', finished: '🏁' };
      const cardIcons    = { active: '⚡', upcoming: '🏆', finished: '🎖' };
      const statusClass  = t.status;
      const now = Date.now();

      let timeInfo = '';
      if (t.status === 'active') {
        const left = Math.max(0, t.endsAt - now);
        timeInfo = '⏱ ' + CH_I18N.t('tournaments.time_left_prefix') + formatDuration(left);
      } else if (t.status === 'upcoming') {
        const until = t.startsAt - now;
        timeInfo = '🕐 ' + CH_I18N.t('tournaments.starts_in_prefix') + formatDuration(until);
      } else {
        const dateLocale = CH_I18N.getLang() === 'ru' ? 'ru' : 'en';
        timeInfo = '🏁 ' + new Date(t.endsAt).toLocaleDateString(dateLocale, { day:'numeric', month:'short', year:'numeric' });
      }

      const ratingInfo = t.minRating || (t.maxRating && t.maxRating < 9999)
        ? `⭐ ${t.minRating || '0'}–${t.maxRating >= 9999 ? '∞' : t.maxRating}`
        : '⭐ ' + CH_I18N.t('tournaments.any_rating');

      const winnerHtml = t.winner
        ? `<div class="winner-badge">🥇 ${escHtml(t.winner)}</div>`
        : '';

      const participantsHtml = `<span class="t-participants">👥 ${t.participantsCount || 0}${t.maxParticipants ? '/' + t.maxParticipants : ''} ${CH_I18N.t('tournaments.participants_suffix')}</span>`;

      const userTournamentBadge = !t.createdByIsAdmin
        ? `<span class="t-meta-item t-user-badge" title="${CH_I18N.t('tournaments.user_created_tooltip')}">👤 ${CH_I18N.t('tournaments.user_created_badge')}</span>`
        : '';

      const clubBadge = t.clubId
        ? `<span class="t-meta-item t-club-badge" title="${t.clubOnly ? CH_I18N.t('tournaments.club_badge_tooltip_restricted') : CH_I18N.t('tournaments.club_badge_tooltip_open')}">🛡️ ${t.clubOnly ? CH_I18N.t('tournaments.club_badge_restricted') : CH_I18N.t('tournaments.club_badge_open')}</span>`
        : '';

      return `
        <a class="t-card status-${statusClass}" href="/tournament/${t.id}">
          <div class="t-card-icon">${cardIcons[t.status] || '🏆'}</div>
          <div class="t-card-main">
            <div class="t-card-title">${escHtml(t.name)}</div>
            <div class="t-card-meta">
              <span class="t-meta-item">${timeInfo}</span>
              <span class="t-meta-item">${ratingInfo}</span>
              <span class="t-meta-item">⏱ ${t.durationMinutes} ${CH_I18N.t('tournaments.minutes_abbr')}</span>
              ${clubBadge}
              ${userTournamentBadge}
              ${t.description ? `<span class="t-meta-item" style="color:var(--text-muted);font-style:italic">${escHtml(t.description.slice(0,50))}${t.description.length>50?'…':''}</span>` : ''}
            </div>
          </div>
          <div class="t-card-right">
            <div class="status-badge ${statusClass}">
              <span class="dot"></span>
              ${statusLabels[t.status]}
            </div>
            <span class="t-time-control">${escHtml(t.timeControl)}</span>
            ${participantsHtml}
            ${winnerHtml}
          </div>
        </a>`;
    }

    // ── BLACKLIST ──
    function addToBlacklist() {
      const input = document.getElementById('t-bl-input');
      const val = (input.value || '').trim();
      if (!val || blacklist.includes(val.toLowerCase())) { input.value = ''; return; }
      blacklist.push(val.toLowerCase());
      input.value = '';
      renderBlacklist();
    }
    function removeFromBlacklist(name) {
      blacklist = blacklist.filter(b => b !== name);
      renderBlacklist();
    }
    function renderBlacklist() {
      const el = document.getElementById('bl-tags');
      el.innerHTML = blacklist.map(n => `
        <span class="bl-tag">
          ${escHtml(n)}
          <span class="bl-tag-remove" onclick="removeFromBlacklist('${escHtml(n)}')">✕</span>
        </span>`).join('');
    }

    // ── CREATE MODAL ──
    function openCreateModal() {
      document.getElementById('create-modal').classList.add('open');
      document.getElementById('t-name').focus();
    }
    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('open');
    }
    document.getElementById('create-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('create-modal')) closeCreateModal();
    });

    async function submitCreateTournament() {
      const btn = document.getElementById('btn-create-submit');
      const name = document.getElementById('t-name').value.trim();
      const desc = document.getElementById('t-desc').value.trim();
      const tc   = document.getElementById('t-tc').value;
      const dur  = document.getElementById('t-duration').value;
      const startsAt = document.getElementById('t-starts-at').value;
      const maxP = parseInt(document.getElementById('t-max').value) || 0;
      const minR = parseInt(document.getElementById('t-min-rating').value) || 0;
      const maxR = parseInt(document.getElementById('t-max-rating').value) || 0;
      const clubSel = document.getElementById('t-club-select');
      const clubId = clubSel ? clubSel.value : '';
      const clubOnly = clubId ? document.getElementById('t-club-only').checked : false;

      if (!name) { toast(CH_I18N.t('tournaments.error.enter_name'), 'error'); return; }
      if (!startsAt) { toast(CH_I18N.t('tournaments.error.pick_start_date'), 'error'); return; }

      btn.disabled = true;
      btn.textContent = CH_I18N.t('tournaments.creating_btn');
      try {
        const res = await fetch(API + '/tournaments', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, description: desc, timeControl: tc,
            durationMinutes: parseInt(dur),
            startsAt: new Date(startsAt).toISOString(),
            maxParticipants: maxP, minRating: minR,
            maxRating: maxR || 9999,
            blacklist: blacklist,
            clubId: clubId || undefined,
            clubOnly,
          })
        });
        const data = await safeJson(res);
        if (!res.ok) throw new Error(data.error || CH_I18N.t('tournaments.error.generic'));
        toast(CH_I18N.t('tournaments.success.created'), 'success');
        closeCreateModal();
        // Reset form
        ['t-name','t-desc','t-bl-input'].forEach(id => document.getElementById(id).value = '');
        if (clubSel) { clubSel.value = ''; onClubSelectChange(); }
        blacklist = [];
        renderBlacklist();
        await loadTournaments();
        // Switch to upcoming
        if (new Date(startsAt) > new Date()) switchTab('upcoming');
        else switchTab('active');
        window.location.href = '/tournament/' + data.id;
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = CH_I18N.t('tournaments.submit_btn');
      }
    }

    // ── UTILS ──
    function formatDuration(ms) {
      if (ms <= 0) return CH_I18N.t('tournaments.duration.zero');
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return h + CH_I18N.t('tournaments.duration.hours') + (m % 60) + CH_I18N.t('tournaments.duration.minutes');
      if (m > 0) return m + CH_I18N.t('tournaments.duration.minutes');
      return s + CH_I18N.t('tournaments.duration.seconds');
    }
function escHtml(s) { return escapeHtml(s); }
    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    document.addEventListener('ch-lang-changed', () => {
      renderList();
      const popList = document.getElementById('popular-list');
      if (popList && popList.innerHTML) renderList(); // счётчики/лейблы уже переведутся applyTranslations, тут перерисовываем только динамические карточки
    });

    init();
  </script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/ping-widget.js"></script>
</body>
</html>
