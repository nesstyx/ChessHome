<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="stats.doc_title">Chess Home — Статистика</title>
  <link rel="icon" href="/img/logo/favicon.png">
  <script src="/js/i18n.js"></script>
  <script src="/js/header.js"></script>
  <style>

    :root {
  --bg-primary: #0e0f13;
  --bg-secondary: #161820;
  --bg-tertiary: #1e2028;
  --border: #2e3040;
  --text-primary: #e8e9f0;
  --text-secondary: #8a8ea8;
  --text-muted: #5a5e78;
  --accent: #c9a84c;
  --accent-darker: #a07830;
}
body {
  background: var(--bg-primary);
  color: var(--text-primary);
}
    /* ── Герой ────────────────────────────────────────────────── */
    .stats-hero {
      position: relative;
      overflow: hidden;
      padding: 56px 24px 40px;
      text-align: center;
      background: radial-gradient(ellipse at 20% 60%, rgba(124,58,237,.18) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 40%, rgba(59,130,246,.12) 0%, transparent 55%),
                  radial-gradient(ellipse at 50% 100%, rgba(16,185,129,.08) 0%, transparent 50%);
      border-bottom: 1px solid var(--border);
    }
    .stats-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }
    .stats-hero-crown {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .stats-hero h1 {
      font-size: clamp(32px, 6vw, 64px);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #f59e0b 0%, #a855f7 45%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0 0 10px;
      line-height: 1;
    }
    .stats-hero-sub {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 28px;
    }
    .stats-born-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(245,158,11,.1);
      border: 1px solid rgba(245,158,11,.3);
      border-radius: 100px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      color: #f59e0b;
    }
    .stats-born-badge .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse-dot 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.5); }
      50%      { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
    }

    /* ── Лейаут ───────────────────────────────────────────────── */
    .stats-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    /* ── Большие счётчики ─────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin: 28px 0;
    }
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 14px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--c, var(--accent));
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .stat-card-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--c, var(--accent)) 0%, transparent 70%);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .stat-card:hover .stat-card-glow { opacity: .08; }
    .stat-card-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--c, var(--accent));
      border-radius: 0 0 18px 18px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 1.4s cubic-bezier(.22,1,.36,1);
    }
    .stat-card.anim .stat-card-bar { transform: scaleX(1); }
    .stat-card-icon { font-size: 30px; display: block; margin-bottom: 10px; }
    .stat-card-num {
      font-size: clamp(20px, 3.5vw, 34px);
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .stat-card-label {
      margin-top: 7px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* ── Секции ───────────────────────────────────────────────── */
    .s-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 14px;
      animation: fadeUp .45s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .s-section:nth-child(2){animation-delay:.04s}
    .s-section:nth-child(3){animation-delay:.08s}
    .s-section:nth-child(4){animation-delay:.12s}
    .s-section:nth-child(5){animation-delay:.16s}
    .s-section:nth-child(6){animation-delay:.20s}
    .s-section:nth-child(7){animation-delay:.24s}

    .s-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .s-title::after { content:''; flex:1; height:1px; background:var(--border); }

    .s-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .s-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media(max-width:700px) {
      .s-row2, .s-row3 { grid-template-columns: 1fr; }
    }

    /* ── Лидерборд ────────────────────────────────────────────── */
    .lb-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 10px;
      transition: background .15s;
    }
    .lb-item:hover { background: rgba(255,255,255,.04); }
    .lb-pos { font-size: 17px; width: 26px; text-align: center; flex-shrink: 0; }
    .lb-name { flex: 1; font-weight: 700; font-size: 14px; color: var(--text-primary); }
    .lb-val  { font-weight: 900; font-size: 15px; color: var(--accent); }

    /* ── Прогресс-бары ────────────────────────────────────────── */
    .bar-row { margin-bottom: 13px; }
    .bar-row-head { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .bar-row-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .bar-row-val   { font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .bar-track { height: 7px; background: rgba(255,255,255,.06); border-radius: 100px; overflow: hidden; }
    .bar-fill  {
      height: 100%; border-radius: 100px;
      width: 0;
      transition: width 1.5s cubic-bezier(.22,1,.36,1);
      background: var(--bc, var(--accent));
    }

    /* ── Активность (мини-бары) ───────────────────────────────── */
    .act-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 64px;
    }
    .act-bar {
      flex: 1;
      border-radius: 3px 3px 0 0;
      min-height: 3px;
      cursor: pointer;
      transition: height 1.1s cubic-bezier(.22,1,.36,1), opacity .3s;
      opacity: .75;
      position: relative;
    }
    .act-bar:hover { opacity: 1; }
    .act-bar::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.88);
      color: #fff;
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 10;
    }
    .act-bar:hover::after { opacity: 1; }
    .act-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }

    /* ── Пончик ───────────────────────────────────────────────── */
    .donut-wrap { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
    .donut-legend { display: flex; flex-direction: column; gap: 10px; }
    .donut-leg-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .donut-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .donut-leg-label { color: var(--text-muted); flex: 1; }
    .donut-leg-pct { font-weight: 800; color: var(--text-primary); margin-left: 6px; }

    /* ── Факты ────────────────────────────────────────────────── */
    .fact-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(124,58,237,.07);
      border: 1px solid rgba(124,58,237,.18);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 10px;
      transition: border-color .2s, transform .2s;
    }
    .fact-card:hover { border-color: rgba(124,58,237,.4); transform: translateX(4px); }
    .fact-icon { font-size: 22px; flex-shrink: 0; }
    .fact-text { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }
    .fact-text strong { color: var(--text-primary); }

    /* ── Живая строка ─────────────────────────────────────────── */
    .live-strip {
      background: linear-gradient(90deg, rgba(16,185,129,.12), rgba(59,130,246,.08), rgba(124,58,237,.12));
      border: 1px solid rgba(16,185,129,.2);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #10b981;
      animation: pulse-dot 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .live-strip-text { font-size: 13px; color: var(--text-secondary); }
    .live-strip-text strong { color: var(--text-primary); }

    /* ── Спиннер ──────────────────────────────────────────────── */
    .s-spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 60px 0; color: var(--text-muted); font-size: 14px; gap: 12px;
    }
    .s-spinner::before {
      content: '';
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Хедер будет вставлен сюда через CH -->
<div id="ch-root"></div>

<div class="stats-hero">
  <span class="stats-hero-crown">♚</span>
  <h1 data-i18n="stats.h1">Статистика сайта</h1>
  <div class="stats-hero-sub" data-i18n="stats.subtitle">Всё что происходит на Chess Home — в живых цифрах</div>
  <div class="stats-born-badge">
    <div class="pulse-dot"></div>
    <span data-i18n="stats.founded">Основан 30.03.2026</span>
    &nbsp;·&nbsp;
    <span data-i18n="stats.uptime_prefix">Работает уже</span>
    <span id="s-days" style="font-size:18px;margin:0 2px">…</span>
    <span data-i18n="stats.days_suffix">дней</span>
  </div>
</div>

<div class="stats-wrap" id="stats-wrap">
  <div class="s-spinner" data-i18n="stats.loading">Загружаем статистику…</div>
</div>

<script>
/* ════════════════════════════════════════════════════
   Chess Home — stats.html
   Загружает /api/stats и рендерит всё динамически
════════════════════════════════════════════════════ */

// ── Утилиты ───────────────────────────────────────────────────
// i18n-хелпер: словарь может быть ещё не загружен — тогда русский fallback
function T(key, fallback) {
  try {
    const v = window.CH_I18N ? window.CH_I18N.t(key) : undefined;
    if (v && v !== key) return v;
  } catch (e) { /* i18n недоступен */ }
  return fallback !== undefined ? fallback : key;
}

function localeTag() {
  try { return (window.CH_I18N ? CH_I18N.getLang() : 'ru') === 'en' ? 'en-US' : 'ru-RU'; }
  catch (e) { return 'ru-RU'; }
}

function fmt(n) { return (n||0).toLocaleString(localeTag()); }

function animCount(el, target, ms = 1600) {
  if (!el) return;
  const start = performance.now();
  const run = now => {
    const p = Math.min((now - start) / ms, 1);
    const e = 1 - Math.pow(2, -10 * p); // easeOutExpo
    el.textContent = Math.round(target * e).toLocaleString(localeTag());
    if (p < 1) requestAnimationFrame(run);
    else el.textContent = target.toLocaleString(localeTag());
  };
  requestAnimationFrame(run);
}

function bars(items, labelKey, valKey, colors) {
  if (!items || !items.length) return `<div style="color:var(--text-muted);font-size:13px">${T('stats.no_data','Нет данных')}</div>`;
  const max = Math.max(...items.map(r => parseInt(r[valKey])||0), 1);
  return items.map((r, i) => {
    const v   = parseInt(r[valKey])||0;
    const pct = (v / max * 100).toFixed(1);
    const c   = Array.isArray(colors) ? colors[i % colors.length] : colors;
    return `<div class="bar-row">
      <div class="bar-row-head">
        <span class="bar-row-label">${r[labelKey]||'—'}</span>
        <span class="bar-row-val">${fmt(v)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="--bc:${c}" data-p="${pct}"></div>
      </div>
    </div>`;
  }).join('');
}

function lb(items, valKey, suffix = '') {
  if (!items || !items.length) return `<div style="color:var(--text-muted);font-size:13px">${T('stats.no_data','Нет данных')}</div>`;
  const medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  return items.map((it, i) => `
    <div class="lb-item">
      <div class="lb-pos">${medals[i]||i+1}</div>
      <div class="lb-name">${it.username}</div>
      <div class="lb-val">${fmt(it[valKey]||0)}${suffix}</div>
    </div>`).join('');
}

function actChart(data, color, days = 30) {
  const arr = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    const found = (data||[]).find(r => r.day && String(r.day).slice(0,10) === key);
    arr.push({ key, cnt: found ? parseInt(found.cnt)||0 : 0 });
  }
  const max = Math.max(...arr.map(d => d.cnt), 1);
  return arr.map(d => {
    const h = Math.max(3, Math.round(d.cnt / max * 58));
    const label = d.key.slice(5).replace('-','/');
    return `<div class="act-bar" style="background:${color};height:3px" data-h="${h}" data-tip="${label}: ${d.cnt}"></div>`;
  }).join('');
}

function donut(gamesByResult) {
  const total = (gamesByResult||[]).reduce((s,r) => s + parseInt(r.cnt), 0) || 1;
  const map = {};
  (gamesByResult||[]).forEach(r => { map[r.result] = parseInt(r.cnt)||0; });
  const w = map['white']||0, d = map['draw']||0, b = map['black']||0;
  const C = 2 * Math.PI * 38;
  const wL = w/total*C, dL = d/total*C, bL = b/total*C;

  const svg = `<svg width="110" height="110" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="14"/>
    <circle id="dw" cx="50" cy="50" r="38" fill="none" stroke="#e2e8f0" stroke-width="14"
      stroke-dasharray="0 ${C}" stroke-dashoffset="0"
      style="transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dasharray 1.4s cubic-bezier(.22,1,.36,1)"/>
    <circle id="dd" cx="50" cy="50" r="38" fill="none" stroke="#94a3b8" stroke-width="14"
      stroke-dasharray="0 ${C}" stroke-dashoffset="${-wL}"
      style="transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dasharray 1.4s cubic-bezier(.22,1,.36,1) .15s"/>
    <circle id="db" cx="50" cy="50" r="38" fill="none" stroke="#334155" stroke-width="14"
      stroke-dasharray="0 ${C}" stroke-dashoffset="${-(wL+dL)}"
      style="transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dasharray 1.4s cubic-bezier(.22,1,.36,1) .3s"/>
    <text x="50" y="54" text-anchor="middle" font-size="11" font-weight="800" fill="var(--text-primary)">${Math.round(w/total*100)}%</text>
  </svg>`;

  const legend = [
    { c:'#e2e8f0', label:T('stats.white_wins','Белые побеждают'),  n: w },
    { c:'#94a3b8', label:T('stats.draws','Ничья'),                 n: d },
    { c:'#334155', label:T('stats.black_wins','Чёрные побеждают'), n: b },
  ].map(it => `
    <div class="donut-leg-item">
      <div class="donut-dot" style="background:${it.c}"></div>
      <span class="donut-leg-label">${it.label}</span>
      <span class="donut-leg-pct">${Math.round(it.n/total*100)}%</span>
    </div>`).join('');

  return { svg, legend, wL, dL, bL, C };
}

// ── Основной рендер ───────────────────────────────────────────
async function loadStats() {
  const wrap = document.getElementById('stats-wrap');
  const COLORS = ['#7c3aed','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#84cc16','#f97316'];

  try {
    // 5.3: токен в HttpOnly-cookie — 'Bearer null' из localStorage больше не отправляем.
    const res = await fetch('/api/stats', { credentials: 'same-origin' });
    if (!res.ok) throw new Error(res.status);
    const D = await res.json();
    // ВАЖНО: раньше переменная называлась T и затеняла i18n-хелпер T()
    const TOT = D.totals, M = D.misc, L = D.leaders, Ch = D.charts;

    // Дни
    document.getElementById('s-days').textContent = D.meta.daysAlive;

    // ── Живая строка ──────────────────────────────────────────
    const liveHTML = `
      <div class="live-strip">
        <div class="live-dot"></div>
        <div class="live-strip-text">
          ${T('stats.live_today_games','Сегодня сыграно')} <strong id="today-games">…</strong> ${T('stats.live_today_games_suffix','партий')} &nbsp;·&nbsp;
          ${T('stats.live_today_puzzles','Решено задач сегодня:')} <strong id="today-puzzles">…</strong> &nbsp;·&nbsp;
          ${T('stats.live_actions_30d','Всего действий за 30 дней:')} <strong>${fmt((Ch.gamesByDay||[]).reduce((s,r)=>s+parseInt(r.cnt),0))}</strong>
        </div>
      </div>`;

    // ── Счётчики ──────────────────────────────────────────────
    const counters = [
      { id:'c-users',    icon:'👥', label:T('stats.c_users','Игроков'),               val: TOT.users,          c:'#7c3aed' },
      { id:'c-games',    icon:'♟️', label:T('stats.c_games','Партий сыграно'),        val: TOT.games,          c:'#3b82f6' },
      { id:'c-messages', icon:'💬', label:T('stats.c_messages','Сообщений'),          val: TOT.messages,       c:'#10b981' },
      { id:'c-puzzlesol',icon:'🧩', label:T('stats.c_puzzle_solved','Задач решено'),  val: TOT.puzzleSolved,   c:'#f59e0b' },
      { id:'c-puztry',   icon:'🎯', label:T('stats.c_puzzle_attempts','Попыток в задачах'), val:TOT.puzzleAttempts, c:'#f97316' },
      { id:'c-posts',    icon:'📰', label:T('stats.c_blog_posts','Статей в блоге'),   val: TOT.blogPosts,      c:'#ef4444' },
      { id:'c-comments', icon:'💭', label:T('stats.c_blog_comments','Комментариев'),  val: TOT.blogComments,   c:'#ec4899' },
      { id:'c-likes',    icon:'❤️', label:T('stats.c_blog_likes','Лайков в блоге'),   val: TOT.blogLikes,      c:'#e11d48' },
      { id:'c-views',    icon:'👁️', label:T('stats.c_blog_views','Просмотров блога'), val: TOT.blogViews,      c:'#06b6d4' },
      { id:'c-forums',   icon:'📋', label:T('stats.c_forum_topics','Тем на форуме'),  val: TOT.forums,         c:'#84cc16' },
      { id:'c-freplies', icon:'✏️', label:T('stats.c_forum_replies','Ответов на форуме'), val: TOT.forumReplies, c:'#a3e635' },
      { id:'c-clubs',    icon:'🛡️', label:T('stats.c_clubs','Клубов'),                val: TOT.clubs,          c:'#d946ef' },
      { id:'c-tours',    icon:'🏆', label:T('stats.c_tournaments','Турниров'),        val: TOT.tournaments,    c:'#fbbf24' },
      { id:'c-dm',       icon:'📨', label:T('stats.c_dms','Личных сообщений'),        val: TOT.dmMessages,     c:'#38bdf8' },
    ];

    const counterHTML = `<div class="stat-grid">${
      counters.map(c => `
        <div class="stat-card" style="--c:${c.c}">
          <div class="stat-card-glow"></div>
          <div class="stat-card-bar"></div>
          <span class="stat-card-icon">${c.icon}</span>
          <div class="stat-card-num" id="${c.id}">0</div>
          <div class="stat-card-label">${c.label}</div>
        </div>`).join('')
    }</div>`;

    // ── Доnut ─────────────────────────────────────────────────
    const dn = donut(Ch.gamesByResult);

    // ── Активность ────────────────────────────────────────────
    const todayKey = new Date().toISOString().slice(0,10);
    const todayGames   = (Ch.gamesByDay||[]).find(r=>String(r.day).slice(0,10)===todayKey);
    const todayGamesN  = todayGames ? parseInt(todayGames.cnt)||0 : 0;

    // ── Сборка страницы ───────────────────────────────────────
    wrap.innerHTML = liveHTML + counterHTML + `

    <div class="s-row2">
      <div class="s-section">
        <div class="s-title">${T('stats.top_rating','🏆 Топ по рейтингу ELO')}</div>
        ${lb(L.rating, 'rating', ' ' + T('stats.suffix_elo','elo'))}
      </div>
      <div class="s-section">
        <div class="s-title">${T('stats.top_puzzle','🧩 Топ по задачам')}</div>
        ${lb(L.puzzle, 'puzzle_rating', ' ' + T('stats.suffix_elo','elo'))}
      </div>
    </div>

    <div class="s-row2">
      <div class="s-section">
        <div class="s-title">${T('stats.top_games','♟️ Больше всех партий')}</div>
        ${lb(L.games, 'games_played', ' ' + T('stats.suffix_games','партий'))}
      </div>
      <div class="s-section">
        <div class="s-title">${T('stats.results','⚖️ Результаты всех партий')}</div>
        <div class="donut-wrap">
          ${dn.svg}
          <div class="donut-legend">${dn.legend}</div>
        </div>
      </div>
    </div>

    <div class="s-section">
      <div class="s-title">${T('stats.activity_30d','📅 Активность за последние 30 дней')}</div>
      <div class="act-label">${T('stats.act_games','♟️ Партии')}</div>
      <div class="act-chart" id="act-games">${actChart(Ch.gamesByDay, '#3b82f6')}</div>
      <div class="act-label" style="margin-top:18px">${T('stats.act_users','👥 Новые игроки')}</div>
      <div class="act-chart" id="act-users">${actChart(Ch.regByDay, '#10b981')}</div>
    </div>

    <div class="s-row2">
      <div class="s-section">
        <div class="s-title">${T('stats.time_controls','⏱️ Контроли времени')}</div>
        ${bars(Ch.gamesByTC, 'time_control', 'cnt', COLORS)}
      </div>
      <div class="s-section">
        <div class="s-title">${T('stats.messages_by_channel','💬 Сообщения по каналам')}</div>
        ${bars([
          { cat:'📨 ' + T('stats.ch_dms','Личные сообщения'),    n: TOT.dmMessages   },
          { cat:'🌐 ' + T('stats.ch_global','Глобальный чат'),   n: TOT.chatMessages  },
          { cat:'🛡️ ' + T('stats.ch_clubs','Чаты клубов'),       n: TOT.clubMessages  },
          { cat:'💭 ' + T('stats.ch_blog','Комментарии блога'),  n: TOT.blogComments  },
          { cat:'📋 ' + T('stats.ch_forum','Ответы на форуме'),  n: TOT.forumReplies  },
        ], 'cat', 'n', COLORS)}
      </div>
    </div>

    <div class="s-section">
      <div class="s-title">${T('stats.facts','🔮 Интересные факты')}</div>
      ${[
        { icon:'♟️', text:T('stats.fact_avg_halfmoves','В среднем в каждой партии делается <strong>{n}</strong> полуходов').replace('{n}', M.avgGameMoves) },
        { icon:'🎯', text:T('stats.fact_puzzle_success','Процент успешных решений задач: <strong>{n}%</strong>').replace('{n}', M.puzzleSuccessRate) },
        { icon:'📅', text:T('stats.fact_total_moves','За всё время существования сайта — примерно <strong>{n}</strong> ходов сделано суммарно').replace('{n}', M.avgGameMoves && TOT.games ? fmt(Math.round(TOT.games * M.avgGameMoves / 2)) : '?') },
        { icon:'💬', text:T('stats.fact_msgs_per_user','На каждого игрока в среднем приходится <strong>{n}</strong> сообщений').replace('{n}', TOT.users ? (TOT.messages / TOT.users).toFixed(1) : 0) },
        { icon:'🏆', text:T('stats.fact_games_per_user','На каждого игрока приходится <strong>{n}</strong> партий в среднем').replace('{n}', TOT.users ? (TOT.games / TOT.users * 2).toFixed(1) : 0) },
        { icon:'🧩', text:T('stats.fact_puzzle_attempts','Задач попытались решить <strong>{n}</strong> раз, из них успешно: <strong>{m}</strong>').replace('{n}', fmt(TOT.puzzleAttempts)).replace('{m}', fmt(TOT.puzzleSolved)) },
        { icon:'❤️', text:T('stats.fact_likes','В блоге поставлено <strong>{n}</strong> лайков на <strong>{m}</strong> статей').replace('{n}', fmt(TOT.blogLikes)).replace('{m}', fmt(TOT.blogPosts)) },
        L.mostWins ? { icon:'🔥', text:T('stats.fact_most_wins','Больше всего побед у игрока <strong>{u}</strong> — <strong>{n}</strong>').replace('{u}', L.mostWins.username).replace('{n}', fmt(L.mostWins.wins)) } : null,
      ].filter(Boolean).map(f => `
        <div class="fact-card">
          <span class="fact-icon">${f.icon}</span>
          <span class="fact-text">${f.text}</span>
        </div>`).join('')}
    </div>

    <div style="text-align:center;padding:24px 0 0;color:var(--text-muted);font-size:12px">
      ${T('stats.footer','Данные обновляются в реальном времени')} &nbsp;·&nbsp; Chess Home
    </div>
    `;

    // ── Анимация счётчиков ────────────────────────────────────
    counters.forEach(c => animCount(document.getElementById(c.id), c.val));
    setTimeout(() => {
      document.querySelectorAll('.stat-card').forEach(el => el.classList.add('anim'));
    }, 300);

    // Сегодняшние игры
    document.getElementById('today-games') && (document.getElementById('today-games').textContent = todayGamesN);
    document.getElementById('today-puzzles') && (document.getElementById('today-puzzles').textContent = '—');

    // ── Анимация баров ────────────────────────────────────────
    setTimeout(() => {
      document.querySelectorAll('.bar-fill').forEach(b => { b.style.width = b.dataset.p + '%'; });
    }, 200);

    // ── Анимация активности ───────────────────────────────────
    setTimeout(() => {
      document.querySelectorAll('.act-bar').forEach(b => {
        b.style.height = b.dataset.h + 'px';
      });
    }, 300);

    // ── Анимация пончика ──────────────────────────────────────
    setTimeout(() => {
      const dw = document.getElementById('dw');
      const dd = document.getElementById('dd');
      const db = document.getElementById('db');
      if (dw) dw.setAttribute('stroke-dasharray', `${dn.wL} ${dn.C}`);
      if (dd) dd.setAttribute('stroke-dasharray', `${dn.dL} ${dn.C}`);
      if (db) db.setAttribute('stroke-dasharray', `${dn.bL} ${dn.C}`);
    }, 400);

  } catch(e) {
    console.error('[Stats]', e);
    wrap.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-muted)">
      ${T('stats.error_load','⚠️ Не удалось загрузить статистику')}<br>
      <small style="margin-top:8px;display:block">${String(e.message).replace(/</g,'&lt;')}</small>
    </div>`;
  }
}

// ── Инициализация хедера и страницы ─────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  if (window.CH) {
    CH.initHeader({ activePage: 'stats' });
    CH.setActivePage('stats');
  }
  // Ждём словарь i18n, чтобы первый рендер был сразу на языке пользователя
  const start = () => loadStats();
  if (window.CH_I18N) CH_I18N.onReady(start); else start();
  // Смена языка → полный перерендер страницы с новыми подписями
  document.addEventListener('ch-lang-changed', () => loadStats());
  // онлайн счётчик обновляется автоматически в header.js
});
</script>
</body>
</html>
